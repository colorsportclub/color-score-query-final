<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLOR LED 成績掃描</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:680px;margin:auto;padding:22px 16px 40px}
h1{font-size:25px;text-align:center;margin:8px 0;color:#111}p.sub{color:#555;text-align:center;font-size:14px;line-height:1.6}
.card{border:1px solid #ddd;border-radius:16px;padding:16px;margin:16px 0;background:#fff}
label{display:block;font-weight:700;margin:13px 0 7px}
input,select,button{font:inherit;width:100%;min-height:46px;border-radius:10px}
input,select{border:1px solid #bbb;padding:10px;background:#fff;color:#111}
button{border:0;padding:12px;font-weight:800;cursor:pointer}
.primary{background:#2457d6;color:#fff}.secondary{background:#eee;color:#111}.warning{background:#fff4d6;color:#6b4500}
#preview{width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:#f5f5f5;margin-top:12px;display:none}
#processed{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f5f5f5;margin-top:8px;display:none}
.status{font-size:14px;line-height:1.6;white-space:pre-wrap;color:#333;margin-top:10px}
.result{font-size:32px;font-weight:900;text-align:center;letter-spacing:1px;margin:12px 0}
.note{font-size:13px;color:#555;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>COLOR LED 成績掃描</h1>
<p class="sub">拍攝停止後的 LED 最終成績，辨識後先確認，再手動記錄。</p>

<section class="card">
  <label for="photo">1. 拍攝或選擇 LED 成績照片</label>
  <input id="photo" type="file" accept="image/*" capture="environment">
  <img id="preview" alt="LED 成績照片預覽">
  <canvas id="processed" aria-label="OCR 增強後影像"></canvas>
  <div class="note">此計時器格式設定為「秒＋兩位小數」，例如 15.89。建議先用 iPhone「照片」編輯功能裁切，只保留 LED 顯示數字的區域，再選取裁切後照片。新版會嘗試分離綠色 LED 亮點並增強對比。</div>
  <button id="scan" class="primary" disabled style="margin-top:12px">辨識照片上的時間</button>
  <div id="status" class="status" role="status">尚未選擇照片。</div>
</section>

<section class="card">
  <label>2. 確認辨識結果（可手動修改）</label>
  <div id="recognized" class="result">—</div>
  <label for="time">成績時間</label>
  <input id="time" type="text" inputmode="decimal" placeholder="例如 15.89">
  <p class="note">OCR 可能把 8 認成 3、把小數點漏掉。請務必對照 LED 照片確認，正式成績以計時器顯示為準。</p>
</section>

<section class="card">
  <label for="student">3. 學員姓名／編號（手動填寫）</label>
  <input id="student" type="text" placeholder="輸入學員姓名或編號">
  <label for="item">測驗項目</label>
  <input id="item" type="text" placeholder="輸入測驗項目">
  <label for="place">測驗地點</label>
  <input id="place" type="text" placeholder="輸入測驗地點">
  <label for="date">測驗日期</label>
  <input id="date" type="date">
  <button id="export" class="primary" style="margin-top:14px">下載已確認的成績 CSV</button>
  <div id="exportStatus" class="status"></div>
  <p class="note">目前版本會把已確認的資料下載成 CSV，方便先檢查流程；尚未直接寫入你的 Google 試算表，避免誤寫正式資料。下一步可再串接 Apps Script 的安全寫入功能。</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const photo=document.getElementById('photo'), preview=document.getElementById('preview'), scan=document.getElementById('scan');
const statusEl=document.getElementById('status'), timeInput=document.getElementById('time'), recognized=document.getElementById('recognized');
const dateInput=document.getElementById('date'), processed=document.getElementById('processed');
const today = new Date();
dateInput.value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
let selectedFile=null;
photo.addEventListener('change',()=>{
  selectedFile=photo.files&&photo.files[0];
  if(!selectedFile){scan.disabled=true;return;}
  preview.src=URL.createObjectURL(selectedFile); preview.style.display='block';
  scan.disabled=false; statusEl.textContent='照片已載入。確認數字清楚後，按「辨識照片上的時間」。';
  timeInput.value='';recognized.textContent='—';
});
function normalizeOCR(s){
  return s.replace(/[OoQ]/g,'0').replace(/[Il|]/g,'1')
    .replace(/[，,]/g,'.').replace(/[；;]/g,':')
    .replace(/[^0-9:.\s]/g,' ').replace(/\s+/g,' ').trim();
}
function extractTime(text){
  const t=normalizeOCR(text);
  // This timer displays seconds with exactly two decimal places.
  const patterns=[
    /(?:^|\D)(\d{1,3})\s*[.:]\s*(\d{2})(?!\d)/,
    /(?:^|\D)(\d{1,3})\s+(\d{2})(?!\d)/
  ];
  for(const re of patterns){
    const m=t.match(re);
    if(m) return `${m[1]}.${m[2]}`;
  }
  return '';
}
async function makeEnhancedImages(file){
  const bitmap = await createImageBitmap(file);
  const maxSide = 2200;
  const scale = Math.min(2.5, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  processed.width = w; processed.height = h;
  const ctx = processed.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(bitmap, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h);
  const grayData = new Uint8ClampedArray(img.data);
  const greenData = new Uint8ClampedArray(img.data);
  for(let i=0;i<img.data.length;i+=4){
    const r=img.data[i], g=img.data[i+1], b=img.data[i+2];
    const gray=0.299*r+0.587*g+0.114*b;
    const contrast=Math.max(0,Math.min(255,(gray-105)*2.4+128));
    grayData[i]=grayData[i+1]=grayData[i+2]=contrast;
    // Green LED separation: brighter green than red/blue becomes white.
    const greenScore=g-Math.max(r,b)*0.62;
    const mask=Math.max(0,Math.min(255,(greenScore-18)*5));
    greenData[i]=greenData[i+1]=greenData[i+2]=mask;
  }
  // Display the green-channel mask as a visual diagnostic.
  img.data.set(greenData);
  ctx.putImageData(img,0,0);
  processed.style.display='block';
  bitmap.close?.();
  return [
    {name:'綠色 LED 分離', image:processed},
    {name:'灰階高對比', imageData:grayData, width:w, height:h}
  ];
}
async function recognizeImage(worker, image, parameters){
  await worker.setParameters(parameters);
  const result=await worker.recognize(image);
  return result.data.text||'';
}
scan.addEventListener('click',async()=>{
  if(!selectedFile)return;
  scan.disabled=true;
  statusEl.textContent='正在處理照片並辨識……首次使用會載入 OCR 元件，請保持網路連線並稍候。';
  let worker;
  try{
    if(typeof Tesseract === 'undefined') throw new Error('OCR 元件未載入，請確認網路連線後重新整理頁面。');
    const variants=await makeEnhancedImages(selectedFile);
    worker=await Tesseract.createWorker('eng');
    const common={tessedit_char_whitelist:'0123456789:.,',preserve_interword_spaces:'1'};
    let raw='',found='';
    // Try green LED mask first, then the original photo, then grayscale/high contrast.
    for(const psm of ['11','7','8']){
      const t=await recognizeImage(worker,variants[0].image,{...common,tessedit_pageseg_mode:psm});
      raw+=`[綠色分離 PSM ${psm}]\n${t}\n`;
      found=extractTime(t);
      if(found)break;
    }
    if(!found){
      const t=await recognizeImage(worker,preview,{...common,tessedit_pageseg_mode:'7'});
      raw+=`[原始照片]\n${t}\n`;
      found=extractTime(t);
    }
    if(!found){
      const grayCanvas=document.createElement('canvas');
      grayCanvas.width=variants[1].width;grayCanvas.height=variants[1].height;
      const gctx=grayCanvas.getContext('2d');
      const id=gctx.createImageData(grayCanvas.width,grayCanvas.height);
      id.data.set(variants[1].imageData);gctx.putImageData(id,0,0);
      const t=await recognizeImage(worker,grayCanvas,{...common,tessedit_pageseg_mode:'7'});
      raw+=`[灰階高對比]\n${t}\n`;
      found=extractTime(t);
    }
    if(found){
      timeInput.value=found;
      recognized.textContent=found;
      statusEl.textContent='辨識完成。此計時器格式按「秒＋兩位小數」處理，請務必對照原始照片確認。';
    }else{
      recognized.textContent='未辨識到時間';
      statusEl.textContent='仍未找到符合「秒＋兩位小數」的時間格式。\nOCR 讀到的文字：\n'+(raw||'(空白)')+'\n建議先裁切照片，只保留 LED 數字區，再重新選取照片辨識。你也可以手動輸入正確時間。';
    }
  }catch(e){
    statusEl.textContent='辨識失敗：'+(e&&e.message?e.message:'未知錯誤')+'\n請確認網路連線後重新整理；也可以手動輸入成績。';
  }finally{
    if(worker){try{await worker.terminate();}catch(_){}}
    scan.disabled=false;
  }
});
document.getElementById('export').addEventListener('click',()=>{
  const student=document.getElementById('student').value.trim();
  const item=document.getElementById('item').value.trim();
  const place=document.getElementById('place').value.trim();
  const date=dateInput.value;
  const time=timeInput.value.trim();
  const out=document.getElementById('exportStatus');
  if(!time){out.textContent='請先確認或輸入成績時間。';return;}
  if(!student||!item||!place||!date){out.textContent='請填寫學員、測驗項目、測驗地點及日期。';return;}
  const rows=[['學員姓名／編號','測驗日期','測驗地點','項目','總成績'],[student,date,place,item,time]];
  const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='COLOR_LED_成績.csv';a.click();URL.revokeObjectURL(url);
  out.textContent='已下載 CSV。請開啟檔案確認資料；這一步尚未自動寫入 Google 試算表。';
});
</script>
</body>
</html>
