<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COLOR 成績查詢系統</title>


  <style>

    /* =====================================================
       全站
       ===================================================== */

    * {
      box-sizing: border-box;
    }


    html {
      background: #ffffff;
    }


    body {

      margin: 0;

      padding: 0;

      background: #ffffff;

      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    }


    /* =====================================================
       最外層
       ===================================================== */

    .page {

      width: 100%;

      min-height: 100vh;

      background: #ffffff;

      padding:
        35px 20px 50px;

    }


    /* =====================================================
       Logo
       ===================================================== */

    .logo-area {

      text-align: center;

      margin-bottom: 12px;

    }


    .logo {

      width: 110px;

      max-width: 40vw;

      height: auto;

      display: block;

      margin:
        0 auto 10px;

      object-fit: contain;

    }


    /* =====================================================
       標題
       ===================================================== */

    .title {

      text-align: center;

      font-size: 34px;

      font-weight: 800;

      letter-spacing: 1px;

      margin: 0;

      color: #222;

    }


    .subtitle {

      text-align: center;

      margin:
        8px 0 30px;

      color: #888;

      font-size: 15px;

    }


    /* =====================================================
       查詢區
       ===================================================== */

    .search-box {

      width: 100%;

      max-width: 560px;

      margin:
        0 auto 28px;

      padding: 28px;

      background: #ffffff;

      border:
        1px solid #eeeeee;

      border-radius: 22px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.07);

    }


    /* =====================================================
       欄位
       ===================================================== */

    .field {

      margin-bottom: 20px;

    }


    .field:last-of-type {

      margin-bottom: 24px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 15px;

      font-weight: 700;

      color: #333;

    }


    select,
    input {

      width: 100%;

      height: 50px;

      padding:
        0 16px;

      border:
        1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

      color: #222;

      font-size: 16px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;

    }


    select:focus,
    input:focus {

      border-color: #111;

      box-shadow:
        0 0 0 3px
        rgba(0,0,0,.06);

    }


    /* =====================================================
       查詢按鈕
       ===================================================== */

    .search-button {

      width: 100%;

      height: 52px;

      border: none;

      border-radius: 14px;

      background: #111111;

      color: #ffffff;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;

    }


    .search-button:hover {

      opacity: .9;

    }


    .search-button:active {

      transform: scale(.98);

    }


    .search-button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    /* =====================================================
       狀態
       ===================================================== */

    #status {

      width: 100%;

      max-width: 760px;

      margin:
        0 auto 20px;

      text-align: center;

      font-size: 15px;

      min-height: 22px;

      color: #777;

    }


    .status-success {

      color: #159447 !important;

    }


    .status-error {

      color: #d93025 !important;

    }


    /* =====================================================
       結果區
       ===================================================== */

    .results-area {

      width: 100%;

      max-width: 760px;

      margin:
        0 auto;

    }


    .results-title {

      font-size: 22px;

      font-weight: 800;

      margin:
        0 0 14px;

    }


    /* =====================================================
       最佳成績
       ===================================================== */

    .best-box {

      display: none;

      margin-bottom: 18px;

      padding: 16px 18px;

      border-radius: 16px;

      background: #111111;

      color: #ffffff;

    }


    .best-box.show {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .best-label {

      font-size: 14px;

      opacity: .75;

    }


    .best-time {

      font-size: 27px;

      font-weight: 800;

    }


    /* =====================================================
       成績卡片
       ===================================================== */

    .result-card {

      background: #ffffff;

      border:
        1px solid #eeeeee;

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 16px;

      box-shadow:
        0 7px 25px
        rgba(0,0,0,.06);

    }


    /* =====================================================
       卡片上方
       ===================================================== */

    .result-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;

      margin-bottom: 12px;

    }


    .item-name {

      font-size: 22px;

      font-weight: 800;

    }


    .test-date {

      color: #888;

      font-size: 14px;

      white-space: nowrap;

    }


    .coach {

      font-size: 14px;

      color: #666;

      margin-bottom: 15px;

    }


    /* =====================================================
       圈數
       ===================================================== */

    .laps-title {

      font-size: 13px;

      font-weight: 700;

      color: #777;

      margin-bottom: 7px;

    }


    .laps {

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 5px;

      margin-bottom: 12px;

    }


    .lap {

      min-width: 0;

      padding:
        7px 4px;

      border-radius: 8px;

      background: #f5f5f5;

      text-align: center;

    }


    .lap-label {

      font-size: 10px;

      color: #999;

      margin-bottom: 2px;

    }


    .lap-value {

      font-size: 14px;

      font-weight: 700;

      color: #333;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    /* =====================================================
       總秒
       ===================================================== */

    .total-box {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      min-height: 52px;

      padding:
        8px 14px;

      border-radius: 13px;

      background: #111111;

      color: #ffffff;

    }


    .total-label {

      font-size: 13px;

      font-weight: 600;

      opacity: .75;

    }


    .total-value {

      font-size: 24px;

      font-weight: 800;

      white-space: nowrap;

    }


    /* =====================================================
       空白結果
       ===================================================== */

    .empty {

      text-align: center;

      padding: 45px 20px;

      color: #999;

      font-size: 15px;

    }


    /* =====================================================
       Footer
       ===================================================== */

    .footer {

      text-align: center;

      margin-top: 35px;

      color: #aaa;

      font-size: 12px;

    }


    /* =====================================================
       手機版
       ===================================================== */

    @media (
      max-width: 600px
    ) {

      .page {

        padding:
          24px 14px 40px;

      }


      .logo {

        width: 90px;

      }


      .title {

        font-size: 27px;

      }


      .subtitle {

        font-size: 13px;

        margin-bottom: 22px;

      }


      .search-box {

        padding: 20px 17px;

        border-radius: 18px;

      }


      select,
      input {

        height: 48px;

        font-size: 16px;

      }


      .result-card {

        padding: 16px;

        border-radius: 17px;

      }


      .item-name {

        font-size: 19px;

      }


      .test-date {

        font-size: 12px;

      }


      .coach {

        font-size: 13px;

      }


      .lap {

        padding:
          6px 2px;

      }


      .lap-label {

        font-size: 9px;

      }


      .lap-value {

        font-size: 12px;

      }


      .total-value {

        font-size: 21px;

      }


      .best-time {

        font-size: 23px;

      }

    }


    /* =====================================================
       超小手機
       ===================================================== */

    @media (
      max-width: 360px
    ) {

      .page {

        padding-left: 10px;

        padding-right: 10px;

      }


      .search-box {

        padding:
          18px 14px;

      }


      .lap-value {

        font-size: 11px;

      }

    }

  

    /* =====================================================
       COLOR 彩色運動風格（覆寫原本黑白樣式）
       ===================================================== */
    html, body {
      background: #eef5ff;
    }

    body {
      color: #172554;
      background: linear-gradient(180deg, #eaf2ff 0%, #f6f0ff 48%, #f8fbff 100%);
    }

    .page {
      background: transparent;
      padding: 28px 18px 44px;
    }

    .title {
      color: #4f46e5;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #64748b;
    }

    .search-box {
      background: rgba(255,255,255,.96);
      border: 1px solid #dbeafe;
      box-shadow: 0 14px 36px rgba(59, 92, 180, .12);
    }

    label {
      color: #334155;
    }

    select, input {
      border-color: #d7e2f2;
      background: #fbfdff;
      color: #1e293b;
    }

    select:focus, input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.14);
    }

    .search-button {
      background: linear-gradient(100deg, #2563eb 0%, #7c3aed 100%);
      box-shadow: 0 8px 18px rgba(79,70,229,.22);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .search-button:hover {
      filter: brightness(1.04);
      box-shadow: 0 10px 22px rgba(79,70,229,.28);
      transform: translateY(-1px);
    }

    .results-title {
      color: #312e81;
    }

    .best-box {
      background: linear-gradient(115deg, #fff7cc 0%, #ffed9e 100%);
      color: #854d0e;
      border: 1px solid #f6d365;
      box-shadow: 0 8px 22px rgba(217, 160, 35, .15);
    }

    .best-label {
      color: #92400e;
      opacity: 1;
      font-weight: 800;
    }

    .best-time {
      color: #92400e;
    }

    .result-card {
      border: 1px solid #dbeafe;
      border-radius: 20px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 8px 24px rgba(49, 75, 145, .09);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(49, 75, 145, .13);
    }

    .result-top {
      display: block;
      margin-bottom: 14px;
    }

    .result-heading {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .test-date {
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      white-space: normal;
    }

    .item-name {
      color: #4338ca;
      font-size: 23px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .coach {
      color: #64748b;
    }

    .laps-title {
      color: #475569;
    }

    .lap {
      background: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
    }

    .lap-label {
      color: #64748b;
    }

    .lap-value {
      color: #1e40af;
    }

    .total-box {
      background: linear-gradient(110deg, #eef2ff 0%, #f3e8ff 100%);
      border: 1px solid #ddd6fe;
      border-radius: 14px;
    }

    .total-label {
      color: #6d28d9;
    }

    .total-value {
      color: #4f46e5;
    }

    .footer {
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .page { padding: 22px 12px 34px; }
      .title { font-size: clamp(25px, 7vw, 32px); }
      .subtitle { font-size: 14px; margin-bottom: 22px; }
      .search-box { padding: 20px 16px; border-radius: 18px; }
      .result-card { padding: 17px; }
      .item-name { font-size: 21px; }
      .best-time { font-size: 24px; }
    }

  </style>

</head>


<body>


  <div class="page">


    <!-- ===================================================
         Logo
         =================================================== -->

    <div class="logo-area">

      <img
        id="logo"
        class="logo"
        src="logo.png"
        alt="COLOR Logo"
        onerror="this.style.display='none';"
      >

    </div>


    <!-- ===================================================
         標題
         =================================================== -->

    <h1 class="title">
      COLOR 成績查詢系統
    </h1>


    <div class="subtitle">
      查詢你的測驗成績
    </div>


    <!-- ===================================================
         查詢表單
         =================================================== -->

    <div class="search-box">


      <!-- 等級 -->

      <div class="field">

        <label for="level">
          等級
        </label>

        <select id="level">

          <option value="">
            請選擇等級
          </option>

        </select>

      </div>


      <!-- 班別 -->

      <div class="field">

        <label for="className">
          班別
        </label>

        <select
          id="className"
          disabled
        >

          <option value="">
            請先選擇等級
          </option>

        </select>

      </div>


      <!-- 姓名 -->

      <div class="field">

        <label for="name">
          姓名
        </label>

        <input
          id="name"
          type="text"
          placeholder="請輸入姓名"
          autocomplete="off"
        >

      </div>


      <!-- 項目 -->

      <div class="field">

        <label for="item">
          項目
        </label>

        <select
          id="item"
          disabled
        >

          <option value="">
            請先輸入姓名
          </option>

        </select>

      </div>


      <!-- 查詢 -->

      <button
        id="searchButton"
        class="search-button"
        type="button"
      >

        查詢成績

      </button>


    </div>


    <!-- ===================================================
         狀態
         =================================================== -->

    <div
      id="status"
    ></div>


    <!-- ===================================================
         結果
         =================================================== -->

    <div class="results-area">


      <h2 class="results-title">
        查詢結果
      </h2>


      <!-- 最佳成績 -->

      <div
        id="bestBox"
        class="best-box"
      >

        <div>

          <div class="best-label">
            最佳成績
          </div>

        </div>

        <div
          id="bestTime"
          class="best-time"
        >
          —
        </div>

      </div>


      <!-- 成績 -->

      <div
        id="results"
      >

        <div class="empty">
          請輸入資料後查詢
        </div>

      </div>


    </div>


    <!-- ===================================================
         Footer
         =================================================== -->

    <div class="footer">
      COLOR 成績查詢系統
    </div>


  </div>


  <script>


    // =====================================================
    // Google Apps Script API
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";


    // =====================================================
    // Logo
    //
    // 如果你的 Logo 不是 logo.png
    // 只需要把 HTML 上面的 src 改掉
    // =====================================================


    // =====================================================
    // 取得元素
    // =====================================================

    const levelSelect =
      document.getElementById(
        "level"
      );


    const classSelect =
      document.getElementById(
        "className"
      );


    const nameInput =
      document.getElementById(
        "name"
      );


    const itemSelect =
      document.getElementById(
        "item"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const statusBox =
      document.getElementById(
        "status"
      );


    const resultsBox =
      document.getElementById(
        "results"
      );


    const bestBox =
      document.getElementById(
        "bestBox"
      );


    const bestTime =
      document.getElementById(
        "bestTime"
      );


    // =====================================================
    // 頁面載入
    // =====================================================

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadLevels();

      }
    );


    // =====================================================
    // 載入等級
    // =====================================================

    async function loadLevels() {

      try {

        setStatus(
          "正在載入等級...",
          ""
        );


        const response =
          await fetch(
            API_URL +
            "?action=levels"
          );


        const levels =
          await response.json();


        levelSelect.innerHTML =
          `
          <option value="">
            請選擇等級
          </option>
          `;


        if (
          Array.isArray(levels)
        ) {

          levels.forEach(
            function(level) {

              const option =
                document.createElement(
                  "option"
                );

              option.value =
                level;

              option.textContent =
                level;

              levelSelect.appendChild(
                option
              );

            }
          );

        }


        setStatus(
          "",
          ""
        );


      }
      catch (error) {

        console.error(error);

        setStatus(
          "等級載入失敗，請重新整理頁面。",
          "error"
        );

      }

    }


    // =====================================================
    // 等級變更
    // =====================================================

    levelSelect.addEventListener(
      "change",
      function () {

        const level =
          levelSelect.value;


        // 清空班別

        classSelect.innerHTML =
          `
          <option value="">
            請選擇班別
          </option>
          `;


        // 清空項目

        itemSelect.innerHTML =
          `
          <option value="">
            請先輸入姓名
          </option>
          `;


        classSelect.value =
          "";


        itemSelect.value =
          "";


        itemSelect.disabled =
          true;


        resultsBox.innerHTML =
          `
          <div class="empty">
            請輸入資料後查詢
          </div>
          `;


        hideBest();


        if (
          !level
        ) {

          classSelect.disabled =
            true;

          classSelect.innerHTML =
            `
            <option value="">
              請先選擇等級
            </option>
            `;

          return;

        }


        loadClasses(
          level
        );

      }
    );


    // =====================================================
    // 載入班別
    // =====================================================

    async function loadClasses(
      level
    ) {

      classSelect.disabled =
        true;


      classSelect.innerHTML =
        `
        <option value="">
          班別載入中...
        </option>
        `;


      try {

        const url =
          API_URL +
          "?action=classes" +
          "&level=" +
          encodeURIComponent(
            level
          );


        const response =
          await fetch(url);


        const classes =
          await response.json();


        classSelect.innerHTML =
          `
          <option value="">
            請選擇班別
          </option>
          `;


        if (
          Array.isArray(classes) &&
          classes.length > 0
        ) {

          classes.forEach(
            function(className) {

              const option =
                document.createElement(
                  "option"
                );

              option.value =
                className;

              option.textContent =
                className;

              classSelect.appendChild(
                option
              );

            }
          );


          classSelect.disabled =
            false;

        }
        else {

          classSelect.innerHTML =
            `
            <option value="">
              找不到班別
            </option>
            `;

        }


      }
      catch (error) {

        console.error(error);

        classSelect.innerHTML =
          `
          <option value="">
            班別載入失敗
          </option>
          `;

        setStatus(
          "班別載入失敗。",
          "error"
        );

      }

    }


    // =====================================================
    // 姓名 / 班別變更
    // =====================================================

    nameInput.addEventListener(
      "input",
      loadItemsIfReady
    );


    classSelect.addEventListener(
      "change",
      loadItemsIfReady
    );


    // =====================================================
    // 載入項目
    // =====================================================

    let itemTimer = null;


    function loadItemsIfReady() {

      clearTimeout(
        itemTimer
      );


      itemTimer =
        setTimeout(
          function() {

            const level =
              levelSelect.value;

            const className =
              classSelect.value;

            const name =
              nameInput.value.trim();


            itemSelect.innerHTML =
              `
              <option value="">
                請選擇項目
              </option>
              `;


            itemSelect.value =
              "";


            itemSelect.disabled =
              true;


            if (
              !level ||
              !className ||
              !name
            ) {

              itemSelect.innerHTML =
                `
                <option value="">
                  請先選擇等級、班別並輸入姓名
                </option>
                `;

              return;

            }


            loadItems(
              level,
              className,
              name
            );

          },
          350
        );

    }


    // =====================================================
    // API 載入項目
    // =====================================================

    async function loadItems(
      level,
      className,
      name
    ) {

      try {

        itemSelect.innerHTML =
          `
          <option value="">
            項目載入中...
          </option>
          `;


        const url =
          API_URL +
          "?action=items" +
          "&level=" +
          encodeURIComponent(
            level
          ) +
          "&className=" +
          encodeURIComponent(
            className
          ) +
          "&name=" +
          encodeURIComponent(
            name
          );


        const response =
          await fetch(url);


        const items =
          await response.json();


        itemSelect.innerHTML =
          `
          <option value="">
            請選擇項目
          </option>
          `;


        if (
          Array.isArray(items) &&
          items.length > 0
        ) {

          items.forEach(
            function(item) {

              const option =
                document.createElement(
                  "option"
                );

              option.value =
                item;

              option.textContent =
                item;

              itemSelect.appendChild(
                option
              );

            }
          );


          itemSelect.disabled =
            false;

        }
        else {

          itemSelect.innerHTML =
            `
            <option value="">
              找不到項目
            </option>
            `;

        }


      }
      catch (error) {

        console.error(error);

        itemSelect.innerHTML =
          `
          <option value="">
            項目載入失敗
          </option>
          `;

      }

    }


    // =====================================================
    // 查詢
    // =====================================================

    searchButton.addEventListener(
      "click",
      searchResults
    );


    async function searchResults() {

      const level =
        levelSelect.value;

      const className =
        classSelect.value;

      const name =
        nameInput.value.trim();

      const item =
        itemSelect.value;


      // ===================================================
      // 檢查資料
      // ===================================================

      if (!level) {

        setStatus(
          "請先選擇等級。",
          "error"
        );

        return;

      }


      if (!className) {

        setStatus(
          "請先選擇班別。",
          "error"
        );

        return;

      }


      if (!name) {

        setStatus(
          "請輸入姓名。",
          "error"
        );

        nameInput.focus();

        return;

      }


      if (!item) {

        setStatus(
          "請選擇項目。",
          "error"
        );

        return;

      }


      // ===================================================
      // 查詢中
      // ===================================================

      searchButton.disabled =
        true;

      searchButton.textContent =
        "查詢中...";


      setStatus(
        "正在查詢成績...",
        ""
      );


      resultsBox.innerHTML =
        `
        <div class="empty">
          查詢中...
        </div>
        `;


      hideBest();


      try {

        const url =
          API_URL +
          "?action=search" +
          "&level=" +
          encodeURIComponent(
            level
          ) +
          "&name=" +
          encodeURIComponent(
            name
          ) +
          "&className=" +
          encodeURIComponent(
            className
          ) +
          "&item=" +
          encodeURIComponent(
            item
          );


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (
          !Array.isArray(data)
        ) {

          throw new Error(
            "API 回傳資料格式錯誤"
          );

        }


        // =================================================
        // 再次依日期由近到遠排序
        // =================================================

        data.sort(
          function(a, b) {

            return parseDate(
              b.testDate
            ) -
            parseDate(
              a.testDate
            );

          }
        );


        // =================================================
        // 沒有成績
        // =================================================

        if (
          data.length === 0
        ) {

          resultsBox.innerHTML =
            `
            <div class="empty">
              找不到符合的成績資料
            </div>
            `;

          setStatus(
            "查詢完成",
            "success"
          );

          return;

        }


        // =================================================
        // 最佳成績
        //
        // 必須至少有 2 筆
        // =================================================

        showBestIfNeeded(
          data
        );


        // =================================================
        // 顯示成績
        // =================================================

        resultsBox.innerHTML =
          data
            .map(
              createResultCard
            )
            .join("");


        setStatus(
          "查詢完成",
          "success"
        );


      }
      catch (error) {

        console.error(error);

        resultsBox.innerHTML =
          `
          <div class="empty">
            查詢失敗，請確認 Apps Script
            與 GitHub 設定。
          </div>
          `;


        setStatus(
          "查詢失敗。",
          "error"
        );

      }
      finally {

        searchButton.disabled =
          false;

        searchButton.textContent =
          "查詢成績";

      }

    }


    // =====================================================
    // 建立成績卡片
    // =====================================================

    function createResultCard(
      result
    ) {

      const laps = [];


      // ===================================================
      // 只加入有資料的圈數
      // ===================================================

      if (
        hasValue(result.lap1)
      ) {

        laps.push(
          createLap(
            "圈1",
            result.lap1
          )
        );

      }


      if (
        hasValue(result.lap2)
      ) {

        laps.push(
          createLap(
            "圈2",
            result.lap2
          )
        );

      }


      if (
        hasValue(result.lap3)
      ) {

        laps.push(
          createLap(
            "圈3",
            result.lap3
          )
        );

      }


      if (
        hasValue(result.lap4)
      ) {

        laps.push(
          createLap(
            "圈4",
            result.lap4
          )
        );

      }


      if (
        hasValue(result.lap5)
      ) {

        laps.push(
          createLap(
            "圈5",
            result.lap5
          )
        );

      }


      // ===================================================
      // 如果完全沒有圈數
      // ===================================================

      const lapsHtml =
        laps.length > 0
          ? `
            <div class="laps-title">
              圈數成績
            </div>

            <div class="laps">
              ${laps.join("")}
            </div>
          `
          : "";


      // ===================================================
      // 總秒
      //
      // 只顯示 K 欄
      // 不自行計算
      // ===================================================

      const total =
        hasValue(
          result.totalSeconds
        )
          ? escapeHtml(
              result.totalSeconds
            )
          : "—";


      return `
        <div class="result-card">

          <div class="result-top">

            <div class="result-heading">
              <div class="test-date">
                ${escapeHtml(
                  result.testDate || ""
                )}
              </div>

              <div class="item-name">
                ${escapeHtml(
                  result.item || ""
                )}
              </div>
            </div>

          </div>


          <div class="coach">
            教練：
            ${escapeHtml(
              result.coach || "—"
            )}
          </div>


          ${lapsHtml}


          <div class="total-box">

            <div class="total-label">
              總秒
            </div>

            <div class="total-value">
              ${total}
            </div>

          </div>

        </div>
      `;

    }


    // =====================================================
    // 建立單圈
    // =====================================================

    function createLap(
      label,
      value
    ) {

      return `
        <div class="lap">

          <div class="lap-label">
            ${label}
          </div>

          <div class="lap-value">
            ${escapeHtml(
              value
            )}
          </div>

        </div>
      `;

    }


    // =====================================================
    // 最佳成績
    //
    // 只有 2 筆以上才顯示
    // =====================================================

    function showBestIfNeeded(
      data
    ) {

      hideBest();


      // ===================================================
      // 少於 2 次
      // ===================================================

      if (
        data.length < 2
      ) {

        return;

      }


      // ===================================================
      // 找出 K 欄有有效數字的資料
      // ===================================================

      const validScores =
        data
          .map(
            function(record) {

              return {
                record: record,

                value:
                  parseTotalSeconds(
                    record.totalSeconds
                  )
              };

            }
          )
          .filter(
            function(item) {

              return (
                item.value !== null
              );

            }
          );


      // ===================================================
      // 沒有足夠的總秒資料
      // ===================================================

      if (
        validScores.length < 2
      ) {

        return;

      }


      // ===================================================
      // 找最小總秒
      // ===================================================

      validScores.sort(
        function(a, b) {

          return a.value -
            b.value;

        }
      );


      const best =
        validScores[0].record;


      if (
        !hasValue(
          best.totalSeconds
        )
      ) {

        return;

      }


      bestTime.textContent =
        best.totalSeconds;


      bestBox.classList.add(
        "show"
      );

    }


    // =====================================================
    // 隱藏最佳成績
    // =====================================================

    function hideBest() {

      bestBox.classList.remove(
        "show"
      );

      bestTime.textContent =
        "—";

    }


    // =====================================================
    // 判斷是否有值
    // =====================================================

    function hasValue(
      value
    ) {

      return (
        value !== null &&
        value !== undefined &&
        String(value).trim() !== ""
      );

    }


    // =====================================================
    // K 欄總秒轉成可比較的數字
    //
    // 支援：
    //
    // 90.29
    // 91
    // 1:30.29
    // =====================================================

    function parseTotalSeconds(
      value
    ) {

      if (
        !hasValue(value)
      ) {

        return null;

      }


      const text =
        String(value)
          .trim();


      // ===================================================
      // 分:秒
      // ===================================================

      if (
        text.includes(":")
      ) {

        const parts =
          text.split(":");


        if (
          parts.length === 2
        ) {

          const minutes =
            Number(
              parts[0]
            );

          const seconds =
            Number(
              parts[1]
            );


          if (
            !isNaN(minutes) &&
            !isNaN(seconds)
          ) {

            return (
              minutes * 60 +
              seconds
            );

          }

        }

      }


      // ===================================================
      // 純數字
      // ===================================================

      const number =
        Number(
          text
            .replace(
              /秒/g,
              ""
            )
            .trim()
        );


      if (
        !isNaN(number)
      ) {

        return number;

      }


      return null;

    }


    // =====================================================
    // 日期解析
    // =====================================================

    function parseDate(
      value
    ) {

      if (
        !value
      ) {

        return 0;

      }


      const text =
        String(value)
          .trim();


      const match =
        text.match(
          /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
        );


      if (
        match
      ) {

        return new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        ).getTime();

      }


      const date =
        new Date(text);


      if (
        !isNaN(
          date.getTime()
        )
      ) {

        return date.getTime();

      }


      return 0;

    }


    // =====================================================
    // 狀態訊息
    // =====================================================

    function setStatus(
      message,
      type
    ) {

      statusBox.textContent =
        message;


      statusBox.className =
        "";


      if (
        type === "success"
      ) {

        statusBox.classList.add(
          "status-success"
        );

      }


      if (
        type === "error"
      ) {

        statusBox.classList.add(
          "status-error"
        );

      }

    }


    // =====================================================
    // HTML 安全處理
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


  </script>
