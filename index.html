<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>COLOR 成績查詢系統</title>


  <style>

    /* =========================================================
       COLOR 成績查詢系統
       GitHub Pages 前端
       
       資料來源：
       Google Apps Script Web App
       ========================================================= */


    /* =========================================================
       基本設定
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f5f7fa 0%,
          #ffffff 100%
        );

      color: #222;

      min-height: 100vh;
    }


    button,
    input,
    select {

      font-family: inherit;

    }


    /* =========================================================
       頁面主要容器
       ========================================================= */

    .page {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding:
        28px
        18px
        50px;
    }


    /* =========================================================
       Logo
       
       請將 COLOR Logo 圖片放在 GitHub：
       
       logo.png
       
       如果你的檔案名稱不同，
       只需要修改下面 img 的 src。
       ========================================================= */

    .logo-area {

      text-align: center;

      margin-bottom: 10px;
    }


    .logo {

      width: 170px;

      max-width: 55vw;

      height: auto;

      display: inline-block;

      object-fit: contain;
    }


    /* 如果 logo.png 不存在，
       顯示文字 Logo */

    .logo-fallback {

      display: none;

      font-size: 34px;

      font-weight: 900;

      letter-spacing: 2px;

      color: #111;
    }


    /* =========================================================
       標題
       ========================================================= */

    .title {

      text-align: center;

      font-size: 32px;

      font-weight: 900;

      letter-spacing: 1px;

      margin:
        5px
        0
        4px;

      color: #111;
    }


    .subtitle {

      text-align: center;

      font-size: 15px;

      color: #777;

      margin-bottom: 24px;
    }


    /* =========================================================
       查詢卡片
       ========================================================= */

    .search-card {

      background: #fff;

      border-radius: 22px;

      padding: 26px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.08);

      border:
        1px solid
        rgba(0, 0, 0, 0.05);

      margin-bottom: 24px;
    }


    /* =========================================================
       欄位
       ========================================================= */

    .field {

      margin-bottom: 18px;
    }


    .field:last-child {

      margin-bottom: 0;
    }


    .field label {

      display: block;

      font-size: 15px;

      font-weight: 700;

      margin-bottom: 8px;

      color: #333;
    }


    select,
    input {

      width: 100%;

      height: 52px;

      border-radius: 13px;

      border:
        1px solid
        #d8dce2;

      background: #fff;

      padding:
        0
        15px;

      font-size: 16px;

      color: #222;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }


    select:focus,
    input:focus {

      border-color: #111;

      box-shadow:
        0 0 0 3px
        rgba(0, 0, 0, 0.08);
    }


    input::placeholder {

      color: #aaa;
    }


    /* =========================================================
       查詢按鈕
       ========================================================= */

    .search-button {

      width: 100%;

      height: 54px;

      border: 0;

      border-radius: 14px;

      background: #111;

      color: #fff;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;

      margin-top: 4px;
    }


    .search-button:hover {

      opacity: .9;
    }


    .search-button:active {

      transform: scale(.985);
    }


    .search-button:disabled {

      cursor: not-allowed;

      opacity: .55;

      transform: none;
    }


    /* =========================================================
       狀態文字
       ========================================================= */

    .status {

      text-align: center;

      font-size: 14px;

      color: #777;

      min-height: 22px;

      margin:
        8px
        0
        16px;
    }


    .status.error {

      color: #d93025;

      font-weight: 700;
    }


    .status.success {

      color: #198754;
    }


    /* =========================================================
       查詢結果區
       ========================================================= */

    .results-title {

      font-size: 20px;

      font-weight: 900;

      margin:
        12px
        0
        12px;
    }


    #results {

      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    /* =========================================================
       成績卡片
       ========================================================= */

    .result-card {

      background: #fff;

      border-radius: 18px;

      padding: 18px;

      box-shadow:
        0 7px 25px
        rgba(0, 0, 0, 0.07);

      border:
        1px solid
        #eeeeee;

      position: relative;

      overflow: hidden;
    }


    /* 最佳成績卡片 */

    .result-card.best {

      border:
        2px solid
        #111;

      box-shadow:
        0 8px 28px
        rgba(0, 0, 0, 0.12);
    }


    /* =========================================================
       最佳成績標籤
       ========================================================= */

    .best-badge {

      position: absolute;

      top: 0;

      right: 0;

      background: #111;

      color: #fff;

      font-size: 12px;

      font-weight: 800;

      padding:
        7px
        12px;

      border-bottom-left-radius: 12px;
    }


    /* =========================================================
       成績標題
       ========================================================= */

    .result-header {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 10px;

      margin-bottom: 8px;

      padding-right: 55px;
    }


    .result-item {

      font-size: 20px;

      font-weight: 900;

      color: #222;
    }


    .result-date {

      font-size: 13px;

      color: #777;

      white-space: nowrap;
    }


    .coach {

      font-size: 14px;

      color: #666;

      margin-bottom: 12px;
    }


    /* =========================================================
       圈數區
       
       五圈固定一排
       ========================================================= */

    .laps-box {

      width: 100%;

      margin-top: 8px;
    }


    .laps-title {

      font-size: 13px;

      font-weight: 700;

      color: #777;

      margin-bottom: 6px;
    }


    .laps-row {

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 5px;

      width: 100%;
    }


    .lap-item {

      min-width: 0;

      background: #f4f5f6;

      border-radius: 8px;

      padding:
        6px
        2px;

      text-align: center;

      overflow: hidden;
    }


    .lap-name {

      display: block;

      font-size: 9px;

      color: #999;

      line-height: 1.2;

      margin-bottom: 2px;
    }


    .lap-value {

      display: block;

      font-size: 12px;

      font-weight: 700;

      color: #333;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       總秒
       
       直接使用 K 欄
       不重新計算
       ========================================================= */

    .total-box {

      margin-top: 10px;

      background: #111;

      color: #fff;

      border-radius: 11px;

      padding:
        10px
        13px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .total-title {

      font-size: 13px;

      color: #ccc;

      font-weight: 600;
    }


    .total-value {

      font-size: 21px;

      font-weight: 900;

      color: #fff;
    }


    /* =========================================================
       沒有結果
       ========================================================= */

    .empty {

      background: #fff;

      border-radius: 16px;

      padding: 28px 20px;

      text-align: center;

      color: #888;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, .05);
    }


    /* =========================================================
       Loading
       ========================================================= */

    .loading {

      display: inline-flex;

      align-items: center;

      gap: 8px;
    }


    .spinner {

      width: 15px;

      height: 15px;

      border:
        2px solid
        #ddd;

      border-top-color: #111;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================================================
       Footer
       ========================================================= */

    .footer {

      text-align: center;

      color: #aaa;

      font-size: 12px;

      margin-top: 30px;
    }


    /* =========================================================
       平板
       ========================================================= */

    @media (max-width: 700px) {

      .page {

        max-width: 620px;

        padding:
          22px
          14px
          40px;
      }


      .title {

        font-size: 28px;
      }


      .search-card {

        padding: 22px;

        border-radius: 19px;
      }

    }


    /* =========================================================
       手機
       ========================================================= */

    @media (max-width: 480px) {

      .page {

        padding:
          18px
          11px
          35px;
      }


      .logo {

        width: 125px;
      }


      .title {

        font-size: 24px;

        letter-spacing: 0;
      }


      .subtitle {

        font-size: 13px;

        margin-bottom: 18px;
      }


      .search-card {

        padding: 17px;

        border-radius: 17px;
      }


      .field {

        margin-bottom: 15px;
      }


      .field label {

        font-size: 14px;
      }


      select,
      input {

        height: 49px;

        font-size: 15px;

        border-radius: 11px;
      }


      .search-button {

        height: 51px;

        font-size: 16px;

        border-radius: 12px;
      }


      .result-card {

        padding: 15px;

        border-radius: 15px;
      }


      .result-item {

        font-size: 18px;
      }


      .result-date {

        font-size: 12px;
      }


      .coach {

        font-size: 13px;
      }


      .laps-row {

        gap: 3px;
      }


      .lap-item {

        padding:
          5px
          1px;

        border-radius: 6px;
      }


      .lap-name {

        font-size: 8px;
      }


      .lap-value {

        font-size: 10px;
      }


      .total-box {

        padding:
          9px
          11px;

        border-radius: 9px;
      }


      .total-title {

        font-size: 12px;
      }


      .total-value {

        font-size: 19px;
      }

    }


  </style>

</head>


<body>


  <main class="page">


    <!-- =======================================================
         COLOR Logo
         
         請將 Logo 上傳到 GitHub，
         檔名設定為：

         logo.png

         並且和 index.html 放在同一個資料夾。
         ======================================================= -->

    <div class="logo-area">

      <img
        src="./logo.png"
        alt="COLOR Logo"
        class="logo"
        id="logoImage"
        onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';"
      >

      <div
        id="logoFallback"
        class="logo-fallback"
      >
        COLOR
      </div>

    </div>


    <!-- =======================================================
         標題
         ======================================================= -->

    <h1 class="title">
      COLOR 成績查詢系統
    </h1>


    <div class="subtitle">
      查詢你的測驗成績
    </div>


    <!-- =======================================================
         查詢表單
         ======================================================= -->

    <section class="search-card">


      <!-- 等級 -->

      <div class="field">

        <label for="level">
          等級
        </label>

        <select id="level">

          <option value="">
            載入中...
          </option>

        </select>

      </div>


      <!-- 班別 -->

      <div class="field">

        <label for="className">
          班別
        </label>

        <select id="className" disabled>

          <option value="">
            請先選擇等級
          </option>

        </select>

      </div>


      <!-- 姓名 -->

      <div class="field">

        <label for="name">
          姓名
        </label>

        <input
          id="name"
          type="text"
          placeholder="請輸入姓名"
          autocomplete="off"
        >

      </div>


      <!-- 項目 -->

      <div class="field">

        <label for="item">
          項目
        </label>

        <select
          id="item"
          disabled
        >

          <option value="">
            請先輸入姓名
          </option>

        </select>

      </div>


      <!-- 查詢 -->

      <button
        id="searchButton"
        class="search-button"
        type="button"
      >
        查詢成績
      </button>


    </section>


    <!-- =======================================================
         狀態
         ======================================================= -->

    <div
      id="status"
      class="status"
    ></div>


    <!-- =======================================================
         查詢結果
         ======================================================= -->

    <h2
      id="resultsTitle"
      class="results-title"
      style="display:none;"
    >
      查詢結果
    </h2>


    <section id="results"></section>


    <!-- =======================================================
         Footer
         ======================================================= -->

    <div class="footer">
      COLOR 成績查詢系統
    </div>


  </main>



  <script>

    /* =========================================================
       COLOR 成績查詢系統
       
       JavaScript 主程式
       
       功能：
       1. 載入等級
       2. 載入班別
       3. 載入項目
       4. 查詢成績
       5. F～J 顯示圈數
       6. K 顯示總秒
       7. 2 次以上才判斷最佳成績
       ========================================================= */


    /* =========================================================
       API 網址
       
       這就是你目前的 Google Apps Script API
       ========================================================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";


    /* =========================================================
       DOM
       ========================================================= */

    const levelSelect =
      document.getElementById("level");

    const classSelect =
      document.getElementById("className");

    const nameInput =
      document.getElementById("name");

    const itemSelect =
      document.getElementById("item");

    const searchButton =
      document.getElementById("searchButton");

    const statusBox =
      document.getElementById("status");

    const resultsBox =
      document.getElementById("results");

    const resultsTitle =
      document.getElementById("resultsTitle");


    /* =========================================================
       API Cache
       
       避免重複請求造成 Google Apps Script 負擔
       ========================================================= */

    const cache = {

      levels: null,

      classes: {},

      items: {}

    };


    /* =========================================================
       工具：清理文字
       ========================================================= */

    function cleanText(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }

      return String(value)
        .replace(/^\s+|\s+$/g, "");

    }


    /* =========================================================
       工具：設定狀態
       ========================================================= */

    function setStatus(
      text,
      type = ""
    ) {

      statusBox.className =
        "status " + type;

      statusBox.textContent =
        text || "";
    }


    /* =========================================================
       Loading
       ========================================================= */

    function setLoading(
      element,
      text
    ) {

      element.innerHTML =
        `<span class="loading">
          <span class="spinner"></span>
          ${escapeHTML(text)}
        </span>`;
    }


    /* =========================================================
       HTML Escape
       ========================================================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       API 請求
       ========================================================= */

    async function apiRequest(
      params
    ) {

      const query =
        new URLSearchParams(params);

      const url =
        API_URL +
        "?" +
        query.toString();

      const response =
        await fetch(
          url,
          {
            method: "GET",

            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "API HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      let data;

      try {

        data =
          JSON.parse(text);

      }
      catch (error) {

        console.error(
          "API 回傳內容：",
          text
        );

        throw new Error(
          "API 回傳不是有效 JSON"
        );

      }


      return data;
    }


    /* =========================================================
       載入等級
       
       預期 Apps Script：
       
       ?action=levels
       ========================================================= */

    async function loadLevels() {

      levelSelect.disabled = true;

      levelSelect.innerHTML =
        `<option value="">載入中...</option>`;


      try {

        let levels =
          cache.levels;


        if (!levels) {

          levels =
            await apiRequest({
              action: "levels"
            });

          cache.levels =
            levels;

        }


        if (
          !Array.isArray(levels) ||
          levels.length === 0
        ) {

          levelSelect.innerHTML =
            `<option value="">
              沒有可用等級
            </option>`;

          return;

        }


        levelSelect.innerHTML =
          `<option value="">
            請選擇等級
          </option>`;


        levels.forEach(
          function(level) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              cleanText(level);

            option.textContent =
              cleanText(level);

            levelSelect.appendChild(
              option
            );

          }
        );


        levelSelect.disabled =
          false;

      }
      catch (error) {

        console.error(error);

        levelSelect.innerHTML =
          `<option value="">
            等級載入失敗
          </option>`;

        setStatus(
          "無法載入等級，請重新整理頁面。",
          "error"
        );

      }

    }


    /* =========================================================
       載入班別
       
       預期：
       
       ?action=classes&level=養成
       
       如果你的 Apps Script 使用的是 levelName，
       可把下面 level 改成 levelName。
       ========================================================= */

    async function loadClasses() {

      const level =
        cleanText(
          levelSelect.value
        );


      classSelect.disabled =
        true;


      classSelect.innerHTML =
        `<option value="">
          載入中...
        </option>`;


      itemSelect.disabled =
        true;

      itemSelect.innerHTML =
        `<option value="">
          請先選擇班別
        </option>`;


      if (!level) {

        classSelect.innerHTML =
          `<option value="">
            請先選擇等級
          </option>`;

        return;

      }


      try {

        let classes =
          cache.classes[level];


        if (!classes) {

          classes =
            await apiRequest({
              action: "classes",
              level: level
            });


          cache.classes[level] =
            classes;

        }


        if (
          !Array.isArray(classes) ||
          classes.length === 0
        ) {

          classSelect.innerHTML =
            `<option value="">
              沒有可用班別
            </option>`;

          return;

        }


        /*
         * 指定班別排序
         *
         * 其餘班別再按照中文排序
         */

        const preferredOrder = [

          "阿寶養成",
          "哲哲養成",
          "陽光休閒",
          "仁愛休閒",
          "北新室內"

        ];


        classes =
          sortClasses(
            classes,
            preferredOrder
          );


        classSelect.innerHTML =
          `<option value="">
            請選擇班別
          </option>`;


        classes.forEach(
          function(className) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              cleanText(className);

            option.textContent =
              cleanText(className);

            classSelect.appendChild(
              option
            );

          }
        );


        classSelect.disabled =
          false;

      }
      catch (error) {

        console.error(error);

        classSelect.innerHTML =
          `<option value="">
            班別載入失敗
          </option>`;

        setStatus(
          "班別載入失敗，請重新選擇等級或重新整理。",
          "error"
        );

      }

    }


    /* =========================================================
       班別排序
       ========================================================= */

    function sortClasses(
      classes,
      preferredOrder
    ) {

      const orderMap = {};

      preferredOrder.forEach(
        function(name, index) {

          orderMap[name] =
            index;

        }
      );


      return [...classes].sort(
        function(a, b) {

          const aName =
            cleanText(a);

          const bName =
            cleanText(b);


          const aHas =
            Object.prototype.hasOwnProperty.call(
              orderMap,
              aName
            );

          const bHas =
            Object.prototype.hasOwnProperty.call(
              orderMap,
              bName
            );


          if (aHas && bHas) {

            return (
              orderMap[aName] -
              orderMap[bName]
            );

          }


          if (aHas) {

            return -1;

          }


          if (bHas) {

            return 1;

          }


          return aName.localeCompare(
            bName,
            "zh-Hant"
          );

        }
      );

    }


    /* =========================================================
       載入項目
       
       預期：
       
       ?action=items
       &level=養成
       &className=阿寶養成
       &name=XXX
       ========================================================= */

    async function loadItems() {

      const level =
        cleanText(
          levelSelect.value
        );

      const className =
        cleanText(
          classSelect.value
        );

      const name =
        cleanText(
          nameInput.value
        );


      itemSelect.disabled =
        true;


      itemSelect.innerHTML =
        `<option value="">
          載入中...
        </option>`;


      if (
        !level ||
        !className ||
        !name
      ) {

        itemSelect.innerHTML =
          `<option value="">
            請先輸入姓名
          </option>`;

        return;

      }


      const cacheKey =
        [
          level,
          className,
          name
        ].join("|");


      try {

        let items =
          cache.items[cacheKey];


        if (!items) {

          items =
            await apiRequest({
              action: "items",
              level: level,
              className: className,
              name: name
            });


          cache.items[cacheKey] =
            items;

        }


        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          itemSelect.innerHTML =
            `<option value="">
              找不到項目
            </option>`;

          return;

        }


        itemSelect.innerHTML =
          `<option value="">
            全部項目
          </option>`;


        items.forEach(
          function(item) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              cleanText(item);

            option.textContent =
              cleanText(item);

            itemSelect.appendChild(
              option
            );

          }
        );


        itemSelect.disabled =
          false;

      }
      catch (error) {

        console.error(error);

        itemSelect.innerHTML =
          `<option value="">
            項目載入失敗
          </option>`;

        setStatus(
          "項目載入失敗，請確認姓名是否正確。",
          "error"
        );

      }

    }


    /* =========================================================
       解析總秒
       
       重要：
       最佳成績只看 K 欄。
       
       支援：
       60
       60.25
       "60.25"
       "1:00.25"
       "1:00"
       ========================================================= */

    function parseTotalSeconds(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return null;

      }


      const text =
        cleanText(value);


      if (!text) {

        return null;

      }


      /*
       * 分:秒.小數
       */

      if (
        text.includes(":")
      ) {

        const parts =
          text.split(":");


        if (parts.length === 2) {

          const minutes =
            Number(
              parts[0]
            );

          const seconds =
            Number(
              parts[1]
            );


          if (
            Number.isFinite(minutes) &&
            Number.isFinite(seconds)
          ) {

            return (
              minutes * 60 +
              seconds
            );

          }

        }

      }


      /*
       * 純數字
       */

      const number =
        Number(text);


      if (
        Number.isFinite(number)
      ) {

        return number;

      }


      return null;

    }


    /* =========================================================
       顯示成績
       
       F = lap1
       G = lap2
       H = lap3
       I = lap4
       J = lap5
       K = totalSeconds
       ========================================================= */

    function renderResults(
      results
    ) {

      resultsBox.innerHTML =
        "";


      if (
        !Array.isArray(results) ||
        results.length === 0
      ) {

        resultsTitle.style.display =
          "none";


        resultsBox.innerHTML =
          `
          <div class="empty">
            查不到符合條件的成績
          </div>
          `;

        return;

      }


      resultsTitle.style.display =
        "block";


      /*
       * =====================================================
       * 最佳成績判斷
       *
       * 非常重要：
       *
       * 只有「同一個項目」有 2 次以上成績，
       * 才顯示最佳成績。
       *
       * 最佳成績：
       * K 欄總秒最小者
       * =====================================================
       */


      const itemGroups = {};


      results.forEach(
        function(result) {

          const item =
            cleanText(
              result.item
            ) || "未分類";


          if (
            !itemGroups[item]
          ) {

            itemGroups[item] =
              [];

          }


          itemGroups[item].push(
            result
          );

        }
      );


      /*
       * 找出每個項目的最佳成績
       */

      const bestMap = {};


      Object.keys(itemGroups)
        .forEach(
          function(item) {

            const records =
              itemGroups[item];


            /*
             * 只有兩筆以上
             * 才允許產生最佳成績
             */

            if (
              records.length < 2
            ) {

              return;

            }


            let bestRecord =
              null;

            let bestSeconds =
              Infinity;


            records.forEach(
              function(record) {

                const total =
                  getTotalValue(
                    record
                  );


                const seconds =
                  parseTotalSeconds(
                    total
                  );


                if (
                  seconds !== null &&
                  seconds < bestSeconds
                ) {

                  bestSeconds =
                    seconds;

                  bestRecord =
                    record;

                }

              }
            );


            if (bestRecord) {

              bestMap[item] =
                bestRecord;

            }

          }
        );


      /*
       * =====================================================
       * 建立卡片
       * =====================================================
       */

      results.forEach(
        function(result) {

          const item =
            cleanText(
              result.item
            ) || "未分類";


          const bestRecord =
            bestMap[item];


          /*
           * 用物件參考判斷
           */

          const isBest =
            bestRecord === result;


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "result-card" +
            (
              isBest
                ? " best"
                : ""
            );


          /*
           * 最佳成績標籤
           */

          let bestBadge =
            "";


          if (isBest) {

            bestBadge =
              `
              <div class="best-badge">
                最佳成績
              </div>
              `;

          }


          /*
           * 圈數
           */

          const lap1 =
            getLapValue(
              result,
              1
            );

          const lap2 =
            getLapValue(
              result,
              2
            );

          const lap3 =
            getLapValue(
              result,
              3
            );

          const lap4 =
            getLapValue(
              result,
              4
            );

          const lap5 =
            getLapValue(
              result,
              5
            );


          /*
           * K 欄總秒
           *
           * 這裡不重新計算。
           */

          const total =
            getTotalValue(
              result
            );


          card.innerHTML =
            `
            ${bestBadge}

            <div class="result-header">

              <div class="result-item">
                ${escapeHTML(item)}
              </div>

              <div class="result-date">
                ${escapeHTML(
                  result.testDate || ""
                )}
              </div>

            </div>


            <div class="coach">
              教練：
              ${escapeHTML(
                result.coach || "—"
              )}
            </div>


            <div class="laps-box">

              <div class="laps-title">
                圈數成績
              </div>

              <div class="laps-row">

                <div class="lap-item">
                  <span class="lap-name">
                    圈1
                  </span>

                  <span class="lap-value">
                    ${escapeHTML(lap1)}
                  </span>
                </div>


                <div class="lap-item">
                  <span class="lap-name">
                    圈2
                  </span>

                  <span class="lap-value">
                    ${escapeHTML(lap2)}
                  </span>
                </div>


                <div class="lap-item">
                  <span class="lap-name">
                    圈3
                  </span>

                  <span class="lap-value">
                    ${escapeHTML(lap3)}
                  </span>
                </div>


                <div class="lap-item">
                  <span class="lap-name">
                    圈4
                  </span>

                  <span class="lap-value">
                    ${escapeHTML(lap4)}
                  </span>
                </div>


                <div class="lap-item">
                  <span class="lap-name">
                    圈5
                  </span>

                  <span class="lap-value">
                    ${escapeHTML(lap5)}
                  </span>
                </div>

              </div>


              <!--
                K 欄總秒
                即使 F～J 全部空白，
                只要 K 有資料也會顯示。
              -->

              <div class="total-box">

                <span class="total-title">
                  總秒
                </span>

                <span class="total-value">
                  ${escapeHTML(
                    total || "—"
                  )}
                </span>

              </div>

            </div>
            `;


          resultsBox.appendChild(
            card
          );

        }
      );

    }


    /* =========================================================
       取得圈數
       
       為了相容不同 Apps Script 欄位名稱，
       同時支援：
       
       lap1
       lap2
       ...
       
       以及：
       
       circle1
       circle2
       ...
       ========================================================= */

    function getLapValue(
      result,
      number
    ) {

      const possibleKeys = [

        "lap" + number,

        "circle" + number,

        "circle_" + number,

        "圈" + number

      ];


      for (
        let i = 0;
        i < possibleKeys.length;
        i++
      ) {

        const key =
          possibleKeys[i];


        if (
          result[key] !== undefined &&
          result[key] !== null &&
          result[key] !== ""
        ) {

          return String(
            result[key]
          );

        }

      }


      /*
       * 如果 API 回傳 raw 欄位：
       *
       * F / G / H / I / J
       */

      const rawKeys = [

        "F",
        "G",
        "H",
        "I",
        "J"

      ];


      const rawKey =
        rawKeys[number - 1];


      if (
        result[rawKey] !== undefined &&
        result[rawKey] !== null &&
        result[rawKey] !== ""
      ) {

        return String(
          result[rawKey]
        );

      }


      return "—";

    }


    /* =========================================================
       取得 K 欄總秒
       
       支援：
       
       totalSeconds
       total
       totalSec
       K
       ========================================================= */

    function getTotalValue(
      result
    ) {

      const keys = [

        "totalSeconds",

        "total",

        "totalSec",

        "totalSecond",

        "K"

      ];


      for (
        let i = 0;
        i < keys.length;
        i++
      ) {

        const key =
          keys[i];


        if (
          result[key] !== undefined &&
          result[key] !== null &&
          result[key] !== ""
        ) {

          return String(
            result[key]
          );

        }

      }


      return "";

    }


    /* =========================================================
       查詢成績
       
       預期 API：
       
       ?action=search
       &level=養成
       &className=阿寶養成
       &name=XXX
       &item=400m
       ========================================================= */

    async function searchScores() {

      const level =
        cleanText(
          levelSelect.value
        );

      const className =
        cleanText(
          classSelect.value
        );

      const name =
        cleanText(
          nameInput.value
        );

      const item =
        cleanText(
          itemSelect.value
        );


      if (!level) {

        setStatus(
          "請先選擇等級。",
          "error"
        );

        return;

      }


      if (!className) {

        setStatus(
          "請先選擇班別。",
          "error"
        );

        return;

      }


      if (!name) {

        setStatus(
          "請輸入姓名。",
          "error"
        );

        nameInput.focus();

        return;

      }


      searchButton.disabled =
        true;


      setLoading(
        searchButton,
        "查詢中..."
      );


      setStatus(
        "正在查詢成績..."
      );


      resultsBox.innerHTML =
        "";


      resultsTitle.style.display =
        "none";


      try {

        const params = {

          action: "search",

          level: level,

          className: className,

          name: name

        };


        /*
         * 有選項目才送 item
         */

        if (item) {

          params.item =
            item;

        }


        const results =
          await apiRequest(
            params
          );


        /*
         * 日期排序：
         * 新的在前面
         */

        if (
          Array.isArray(results)
        ) {

          results.sort(
            function(a, b) {

              const dateA =
                parseDate(
                  a.testDate
                );

              const dateB =
                parseDate(
                  b.testDate
                );


              if (
                dateA === null &&
                dateB === null
              ) {

                return 0;

              }


              if (
                dateA === null
              ) {

                return 1;

              }


              if (
                dateB === null
              ) {

                return -1;

              }


              return (
                dateB - dateA
              );

            }
          );

        }


        renderResults(
          results
        );


        setStatus(
          "查詢完成",
          "success"
        );

      }
      catch (error) {

        console.error(
          "查詢錯誤：",
          error
        );


        resultsBox.innerHTML =
          `
          <div class="empty">
            查詢失敗，請稍後再試。
          </div>
          `;


        setStatus(
          "查詢失敗：" +
          error.message,
          "error"
        );

      }
      finally {

        searchButton.disabled =
          false;

        searchButton.textContent =
          "查詢成績";

      }

    }


    /* =========================================================
       日期解析
       ========================================================= */

    function parseDate(
      value
    ) {

      if (
        !value
      ) {

        return null;

      }


      const date =
        new Date(
          value
        );


      if (
        !isNaN(
          date.getTime()
        )
      ) {

        return date.getTime();

      }


      /*
       * 支援 yyyy/MM/dd
       */

      const match =
        String(value)
          .match(
            /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/
          );


      if (match) {

        return new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        ).getTime();

      }


      return null;

    }


    /* =========================================================
       Event：選擇等級
       ========================================================= */

    levelSelect.addEventListener(
      "change",
      function() {

        /*
         * 清空班別
         */

        classSelect.innerHTML =
          `<option value="">
            載入中...
          </option>`;


        /*
         * 清空項目
         */

        itemSelect.innerHTML =
          `<option value="">
            請先選擇班別
          </option>`;

        itemSelect.disabled =
          true;


        /*
         * 清空結果
         */

        resultsBox.innerHTML =
          "";

        resultsTitle.style.display =
          "none";


        loadClasses();

      }
    );


    /* =========================================================
       Event：選擇班別
       ========================================================= */

    classSelect.addEventListener(
      "change",
      function() {

        itemSelect.innerHTML =
          `<option value="">
            請先輸入姓名
          </option>`;

        itemSelect.disabled =
          true;


        resultsBox.innerHTML =
          "";

        resultsTitle.style.display =
          "none";


        /*
         * 如果已經輸入姓名，
         * 直接載入項目
         */

        if (
          cleanText(
            nameInput.value
          )
        ) {

          loadItems();

        }

      }
    );


    /* =========================================================
       Event：姓名輸入
       
       不要每打一個字就呼叫 API。
       
       使用停止輸入 500ms 後再載入。
       ========================================================= */

    let nameTimer = null;


    nameInput.addEventListener(
      "input",
      function() {

        clearTimeout(
          nameTimer
        );


        nameTimer =
          setTimeout(
            function() {

              loadItems();

            },
            500
          );

      }
    );


    /* =========================================================
       Event：按 Enter 查詢
       ========================================================= */

    nameInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          searchScores();

        }

      }
    );


    /* =========================================================
       Event：查詢按鈕
       ========================================================= */

    searchButton.addEventListener(
      "click",
      searchScores
    );


    /* =========================================================
       啟動
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadLevels();

      }
    );


    /*
     * 有些瀏覽器 DOMContentLoaded
     * 在 script 放在 body 最後時可能已經觸發，
     * 所以補一次初始化。
     */

    if (
      document.readyState ===
      "loading"
    ) {

      // 等待 DOMContentLoaded

    }
    else {

      loadLevels();

    }


  </script>

</body>
</html>
