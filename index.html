<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>COLOR 成績查詢系統</title>


<style>

/* ==========================================================
   基本設定
   ========================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f4f6f9 0%,
      #ffffff 100%
    );

  color: #222;

  min-height: 100vh;

}


.container {

  width: 100%;

  max-width: 560px;

  margin: 0 auto;

  padding:
    24px 15px 45px;

}


/* ==========================================================
   Logo
   ========================================================== */

.logo-box {

  text-align: center;

  margin-bottom: 8px;

}


.logo {

  width: 170px;

  max-width: 70%;

  height: auto;

  object-fit: contain;

}


/* ==========================================================
   標題
   ========================================================== */

h1 {

  margin:
    5px 0 5px;

  text-align: center;

  font-size: 27px;

  font-weight: 800;

}


.subtitle {

  text-align: center;

  color: #777;

  font-size: 14px;

  margin-bottom: 24px;

}


/* ==========================================================
   查詢卡片
   ========================================================== */

.search-card {

  background: #fff;

  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 8px 28px
    rgba(0,0,0,0.08);

}


.field {

  margin-bottom: 15px;

}


label {

  display: block;

  margin-bottom: 7px;

  font-size: 14px;

  font-weight: 700;

  color: #444;

}


select,
input {

  width: 100%;

  height: 48px;

  border:
    1px solid #d8dce3;

  border-radius: 12px;

  padding:
    0 14px;

  background: #fff;

  font-size: 16px;

  outline: none;

}


select:focus,
input:focus {

  border-color: #111;

  box-shadow:
    0 0 0 3px
    rgba(0,0,0,0.06);

}


select:disabled {

  background: #f2f3f5;

  color: #999;

}


/* ==========================================================
   查詢按鈕
   ========================================================== */

.search-button {

  width: 100%;

  height: 50px;

  margin-top: 5px;

  border: none;

  border-radius: 13px;

  background: #111;

  color: #fff;

  font-size: 17px;

  font-weight: 700;

}


.search-button:disabled {

  opacity: 0.5;

}


/* ==========================================================
   狀態
   ========================================================== */

.status {

  min-height: 22px;

  margin:
    15px 0 10px;

  text-align: center;

  font-size: 14px;

  color: #777;

}


/* ==========================================================
   成績
   ========================================================== */

.results {

  display: flex;

  flex-direction: column;

  gap: 14px;

}


.result-card {

  background: #fff;

  border-radius: 18px;

  padding: 17px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.07);

}


.result-top {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 10px;

}


.result-item {

  font-size: 19px;

  font-weight: 800;

}


.date {

  color: #777;

  font-size: 13px;

  white-space: nowrap;

}


.coach {

  margin-top: 9px;

  margin-bottom: 12px;

  font-size: 14px;

  color: #555;

}


/* ==========================================================
   最佳成績
   ========================================================== */

.best {

  display: inline-block;

  margin-top: 6px;

  padding:
    4px 9px;

  border-radius: 20px;

  background: #fff1a8;

  color: #725900;

  font-size: 12px;

  font-weight: 800;

}


/* ==========================================================
   圈數
   ========================================================== */

.laps {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 8px;

  margin-bottom: 12px;

}


.lap {

  background: #f4f5f7;

  border-radius: 10px;

  padding: 9px;

  text-align: center;

}


.lap-label {

  display: block;

  color: #777;

  font-size: 12px;

  margin-bottom: 3px;

}


.lap-value {

  font-size: 16px;

  font-weight: 700;

}


/* ==========================================================
   總秒
   ========================================================== */

.total {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  padding:
    12px 14px;

  background: #111;

  color: #fff;

  border-radius: 12px;

}


.total-label {

  font-size: 14px;

  opacity: 0.75;

}


.total-value {

  font-size: 22px;

  font-weight: 800;

}


/* ==========================================================
   無資料
   ========================================================== */

.empty {

  padding: 30px 20px;

  background: #fff;

  border-radius: 18px;

  text-align: center;

  color: #777;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.06);

}


/* ==========================================================
   手機
   ========================================================== */

@media (max-width: 480px) {

  .container {

    padding:
      18px 12px 35px;

  }


  h1 {

    font-size: 24px;

  }


  .search-card {

    padding: 16px;

  }


  .result-card {

    padding: 14px;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- ======================================================
       COLOR LOGO

       如果你的 Logo 檔案放在：
       images/color-logo.png

       就會自動顯示。
       ====================================================== -->

  <div class="logo-box">

    <img
      class="logo"
      src="images/color-logo.png"
      alt="COLOR Logo"
      onerror="this.style.display='none'"
    >

  </div>


  <h1>
    COLOR 成績查詢系統
  </h1>


  <div class="subtitle">
    查詢你的測驗成績
  </div>



  <!-- ======================================================
       查詢區
       ====================================================== -->

  <div class="search-card">


    <!-- 等級 -->

    <div class="field">

      <label>
        等級
      </label>

      <select id="level">

        <option value="">
          請選擇等級
        </option>

      </select>

    </div>


    <!-- 班別 -->

    <div class="field">

      <label>
        班別
      </label>

      <select
        id="className"
        disabled
      >

        <option value="">
          請先選擇等級
        </option>

      </select>

    </div>


    <!-- 姓名 -->

    <div class="field">

      <label>
        姓名
      </label>

      <input
        id="name"
        type="text"
        placeholder="請輸入姓名"
        autocomplete="off"
      >

    </div>


    <!-- 項目 -->

    <div class="field">

      <label>
        項目
      </label>

      <select
        id="item"
        disabled
      >

        <option value="">
          請先選擇班別與姓名
        </option>

      </select>

    </div>


    <button
      id="searchButton"
      class="search-button"
    >
      查詢成績
    </button>


  </div>



  <!-- 狀態 -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- 結果 -->

  <div
    id="results"
    class="results"
  ></div>


</div>



<script>


// ==========================================================
// Apps Script API
// ==========================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";



// ==========================================================
// 元件
// ==========================================================

const levelSelect =
  document.getElementById(
    "level"
  );


const classSelect =
  document.getElementById(
    "className"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const itemSelect =
  document.getElementById(
    "item"
  );


const searchButton =
  document.getElementById(
    "searchButton"
  );


const status =
  document.getElementById(
    "status"
  );


const resultsBox =
  document.getElementById(
    "results"
  );



// ==========================================================
// 載入等級
// ==========================================================

async function loadLevels() {

  try {

    status.textContent =
      "正在載入等級…";


    const response =
      await fetch(
        API_URL +
        "?action=levels"
      );


    const levels =
      await response.json();


    levelSelect.innerHTML =
      '<option value="">請選擇等級</option>';


    levels.forEach(
      function(level) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          level;


        option.textContent =
          level;


        levelSelect.appendChild(
          option
        );

      }
    );


    status.textContent = "";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "等級載入失敗";

  }

}



// ==========================================================
// 選擇等級
// ==========================================================

levelSelect.addEventListener(
  "change",
  async function() {

    const level =
      levelSelect.value;


    classSelect.disabled =
      true;


    classSelect.innerHTML =
      '<option value="">載入班別中…</option>';


    itemSelect.disabled =
      true;


    itemSelect.innerHTML =
      '<option value="">請先選擇班別與姓名</option>';


    resultsBox.innerHTML =
      "";


    if (!level) {

      classSelect.innerHTML =
        '<option value="">請先選擇等級</option>';

      return;

    }


    try {

      status.textContent =
        "正在載入班別…";


      const response =
        await fetch(
          API_URL +
          "?action=classes" +
          "&level=" +
          encodeURIComponent(
            level
          )
        );


      const classes =
        await response.json();


      classSelect.innerHTML =
        '<option value="">請選擇班別</option>';


      classes.forEach(
        function(className) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            className;


          option.textContent =
            className;


          classSelect.appendChild(
            option
          );

        }
      );


      classSelect.disabled =
        false;


      status.textContent = "";

    }

    catch (error) {

      console.error(error);

      classSelect.innerHTML =
        '<option value="">班別載入失敗</option>';


      status.textContent =
        "班別載入失敗";

    }

  }
);



// ==========================================================
// 班別改變
// ==========================================================

classSelect.addEventListener(
  "change",
  loadItems
);



// ==========================================================
// 姓名輸入
// ==========================================================

nameInput.addEventListener(
  "input",
  debounce(
    loadItems,
    400
  )
);



// ==========================================================
// 載入項目
// ==========================================================

async function loadItems() {

  const level =
    levelSelect.value;


  const className =
    classSelect.value;


  const name =
    nameInput.value.trim();


  itemSelect.disabled =
    true;


  itemSelect.innerHTML =
    '<option value="">請選擇項目</option>';


  if (
    !level ||
    !className ||
    !name
  ) {

    return;

  }


  try {

    status.textContent =
      "正在載入項目…";


    const url =
      API_URL +
      "?action=items" +
      "&level=" +
      encodeURIComponent(
        level
      ) +
      "&className=" +
      encodeURIComponent(
        className
      ) +
      "&name=" +
      encodeURIComponent(
        name
      );


    const response =
      await fetch(url);


    const items =
      await response.json();


    itemSelect.innerHTML =
      '<option value="">請選擇項目</option>';


    items.forEach(
      function(item) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          item;


        option.textContent =
          item;


        itemSelect.appendChild(
          option
        );

      }
    );


    itemSelect.disabled =
      false;


    status.textContent = "";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "項目載入失敗";

  }

}



// ==========================================================
// 查詢
// ==========================================================

searchButton.addEventListener(
  "click",
  searchScores
);



async function searchScores() {

  const level =
    levelSelect.value;


  const className =
    classSelect.value;


  const name =
    nameInput.value.trim();


  const item =
    itemSelect.value;


  if (!level) {

    status.textContent =
      "請選擇等級";

    return;

  }


  if (!className) {

    status.textContent =
      "請選擇班別";

    return;

  }


  if (!name) {

    status.textContent =
      "請輸入姓名";

    return;

  }


  if (!item) {

    status.textContent =
      "請選擇項目";

    return;

  }


  try {

    searchButton.disabled =
      true;


    status.textContent =
      "查詢中…";


    resultsBox.innerHTML =
      "";


    const url =
      API_URL +
      "?action=search" +
      "&level=" +
      encodeURIComponent(
        level
      ) +
      "&className=" +
      encodeURIComponent(
        className
      ) +
      "&name=" +
      encodeURIComponent(
        name
      ) +
      "&item=" +
      encodeURIComponent(
        item
      );


    const response =
      await fetch(url);


    const data =
      await response.json();


    renderResults(
      data
    );


    status.textContent =
      data.length
        ? "查詢完成"
        : "找不到符合的成績";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "查詢失敗，請稍後再試";

  }

  finally {

    searchButton.disabled =
      false;

  }

}



// ==========================================================
// 顯示結果
// ==========================================================

function renderResults(
  data
) {

  resultsBox.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    resultsBox.innerHTML =
      '<div class="empty">目前沒有找到成績</div>';

    return;

  }


  // ========================================================
  // 日期新 → 舊
  // ========================================================

  data.sort(
    function(a, b) {

      return (
        parseDate(
          b.testDate
        ) -
        parseDate(
          a.testDate
        )
      );

    }
  );


  // ========================================================
  // 最佳成績
  //
  // 必須至少有 2 筆
  // 而且比較 K 欄「總秒」
  // 數字越小越好
  // ========================================================

  let bestIndex =
    -1;


  if (
    data.length >= 2
  ) {

    let bestValue =
      Infinity;


    data.forEach(
      function(row, index) {

        const total =
          parseTimeToSeconds(
            row.totalSeconds
          );


        if (
          total !== null &&
          total < bestValue
        ) {

          bestValue =
            total;

          bestIndex =
            index;

        }

      }
    );

  }



  // ========================================================
  // 建立卡片
  // ========================================================

  data.forEach(
    function(row, index) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "result-card";


      // ====================================================
      // 上方
      // ====================================================

      const top =
        document.createElement(
          "div"
        );


      top.className =
        "result-top";


      const left =
        document.createElement(
          "div"
        );


      const itemTitle =
        document.createElement(
          "div"
        );


      itemTitle.className =
        "result-item";


      itemTitle.textContent =
        row.item || "項目";


      left.appendChild(
        itemTitle
      );


      // ====================================================
      // 最佳成績
      // ====================================================

      if (
        index === bestIndex
      ) {

        const best =
          document.createElement(
            "div"
          );


        best.className =
          "best";


        best.textContent =
          "🏆 最佳成績";


        left.appendChild(
          best
        );

      }


      top.appendChild(
        left
      );


      const date =
        document.createElement(
          "div"
        );


      date.className =
        "date";


      date.textContent =
        row.testDate || "";


      top.appendChild(
        date
      );


      card.appendChild(
        top
      );



      // ====================================================
      // 教練
      // ====================================================

      if (
        row.coach
      ) {

        const coach =
          document.createElement(
            "div"
          );


        coach.className =
          "coach";


        coach.textContent =
          "教練：" +
          row.coach;


        card.appendChild(
          coach
        );

      }



      // ====================================================
      // 圈數
      //
      // F:J 有資料才顯示
      // ====================================================

      if (
        row.laps &&
        row.laps.length > 0
      ) {

        const laps =
          document.createElement(
            "div"
          );


        laps.className =
          "laps";


        row.laps.forEach(
          function(
            lap,
            lapIndex
          ) {

            const box =
              document.createElement(
                "div"
              );


            box.className =
              "lap";


            const label =
              document.createElement(
                "span"
              );


            label.className =
              "lap-label";


            label.textContent =
              "圈 " +
              (lapIndex + 1);


            const value =
              document.createElement(
                "span"
              );


            value.className =
              "lap-value";


            value.textContent =
              formatTime(
                lap
              ) +
              " 秒";


            box.appendChild(
              label
            );


            box.appendChild(
              value
            );


            laps.appendChild(
              box
            );

          }
        );


        card.appendChild(
          laps
        );

      }



      // ====================================================
      // K 欄總秒
      //
      // 不管 F:J 有沒有資料
      // 只要 K 有資料就顯示
      // ====================================================

      const total =
        document.createElement(
          "div"
        );


      total.className =
        "total";


      const totalLabel =
        document.createElement(
          "span"
        );


      totalLabel.className =
        "total-label";


      totalLabel.textContent =
        "總秒";


      const totalValue =
        document.createElement(
          "span"
        );


      totalValue.className =
        "total-value";


      if (
        row.totalSeconds !==
          undefined &&
        row.totalSeconds !==
          null &&
        String(
          row.totalSeconds
        ).trim() !== ""
      ) {

        totalValue.textContent =
          formatTime(
            row.totalSeconds
          ) +
          " 秒";

      }

      else {

        totalValue.textContent =
          "—";

      }


      total.appendChild(
        totalLabel
      );


      total.appendChild(
        totalValue
      );


      card.appendChild(
        total
      );


      resultsBox.appendChild(
        card
      );

    }
  );

}



// ==========================================================
// 時間轉換
//
// 支援：
//
// 28
// 28.11
// 1:28
// 1:28.11
//
// 最佳成績比較時都轉成秒數
// ==========================================================

function parseTimeToSeconds(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return null;

  }


  const text =
    String(value)
      .trim();


  if (
    text === ""
  ) {

    return null;

  }


  // --------------------------------------------------------
  // 分:秒
  // --------------------------------------------------------

  if (
    text.includes(":")
  ) {

    const parts =
      text.split(":");


    if (
      parts.length === 2
    ) {

      const minutes =
        Number(
          parts[0]
        );


      const seconds =
        Number(
          parts[1]
        );


      if (
        !isNaN(minutes) &&
        !isNaN(seconds)
      ) {

        return (
          minutes * 60 +
          seconds
        );

      }

    }


    return null;

  }


  // --------------------------------------------------------
  // 單純秒數
  // --------------------------------------------------------

  const seconds =
    Number(text);


  if (
    !isNaN(seconds)
  ) {

    return seconds;

  }


  return null;

}



// ==========================================================
// 顯示時間
//
// 保留原本資料格式
// ==========================================================

function formatTime(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const text =
    String(value)
      .trim();


  if (
    text === ""
  ) {

    return "";

  }


  return text;

}



// ==========================================================
// 日期
// ==========================================================

function parseDate(
  text
) {

  if (
    !text
  ) {

    return 0;

  }


  const parts =
    String(text)
      .split("/");


  if (
    parts.length !== 3
  ) {

    return 0;

  }


  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  ).getTime();

}



// ==========================================================
// debounce
// ==========================================================

function debounce(
  func,
  delay
) {

  let timer;


  return function() {

    const context =
      this;

    const args =
      arguments;


    clearTimeout(
      timer
    );


    timer =
      setTimeout(
        function() {

          func.apply(
            context,
            args
          );

        },
        delay
      );

  };

}



// ==========================================================
// 啟動
// ==========================================================

loadLevels();

</script>

</body>

</html>
