<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>COLOR 成績查詢系統</title>


<style>

/* =====================================================
   基本
===================================================== */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {

  margin: 0;

  min-height: 100vh;

  background: #ffffff;

  color: #222222;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
}


/* =====================================================
   主容器
===================================================== */

.page {

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

  padding:
    25px
    16px
    50px;

  background: #ffffff;
}


/* =====================================================
   Logo
===================================================== */

.logo-area {

  text-align: center;

  margin-bottom: 8px;
}

.logo {

  display: block;

  width: 150px;

  max-width: 45vw;

  height: auto;

  margin: 0 auto;

  object-fit: contain;
}


/* =====================================================
   標題
===================================================== */

.title {

  margin:
    5px
    0
    5px;

  text-align: center;

  font-size: 30px;

  font-weight: 900;
}

.subtitle {

  margin:
    0
    0
    25px;

  text-align: center;

  color: #888888;

  font-size: 14px;
}


/* =====================================================
   查詢卡片
===================================================== */

.search-card {

  padding: 25px;

  background: #ffffff;

  border-radius: 20px;

  box-shadow:
    0 8px 30px
    rgba(
      0,
      0,
      0,
      0.08
    );
}


/* =====================================================
   欄位
===================================================== */

.field {

  margin-bottom: 18px;
}

label {

  display: block;

  margin-bottom: 7px;

  font-size: 15px;

  font-weight: 800;
}

select,
input {

  width: 100%;

  height: 50px;

  padding:
    0
    14px;

  border:
    1px solid
    #d8d8d8;

  border-radius: 12px;

  background: #ffffff;

  color: #222222;

  font-size: 16px;

  outline: none;
}

select:focus,
input:focus {

  border-color: #111111;

  box-shadow:
    0 0 0 3px
    rgba(
      0,
      0,
      0,
      0.06
    );
}

select:disabled {

  background: #f3f3f3;

  color: #999999;
}


/* =====================================================
   按鈕
===================================================== */

.search-button {

  width: 100%;

  height: 53px;

  border: 0;

  border-radius: 13px;

  background: #111111;

  color: #ffffff;

  font-size: 17px;

  font-weight: 800;

  cursor: pointer;
}

.search-button:disabled {

  background: #999999;

  cursor: not-allowed;
}


/* =====================================================
   狀態
===================================================== */

.status {

  min-height: 25px;

  margin:
    13px
    0;

  text-align: center;

  font-size: 14px;

  font-weight: 700;
}

.status.success {
  color: #159447;
}

.status.error {
  color: #d93025;
}

.status.loading {
  color: #777777;
}


/* =====================================================
   查詢結果
===================================================== */

.result-title {

  margin:
    25px
    0
    14px;

  font-size: 21px;

  font-weight: 900;
}

.result-card {

  margin-bottom: 15px;

  padding: 18px;

  background: #ffffff;

  border:
    1px solid
    #eeeeee;

  border-radius: 18px;

  box-shadow:
    0 7px 25px
    rgba(
      0,
      0,
      0,
      0.07
    );
}

.result-card.best {

  border:
    2px solid
    #111111;
}


/* =====================================================
   最佳成績
===================================================== */

.best-badge {

  display: inline-block;

  margin-bottom: 10px;

  padding:
    5px
    10px;

  border-radius: 999px;

  background: #111111;

  color: #ffffff;

  font-size: 12px;

  font-weight: 800;
}


/* =====================================================
   項目＋日期
===================================================== */

.result-top {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 10px;
}

.result-item {

  font-size: 20px;

  font-weight: 900;

  line-height: 1.3;
}

.result-date {

  color: #888888;

  font-size: 12px;

  white-space: nowrap;
}


/* =====================================================
   教練
===================================================== */

.coach {

  margin:
    7px
    0
    13px;

  color: #666666;

  font-size: 14px;
}


/* =====================================================
   圈數標題
===================================================== */

.lap-title {

  margin-bottom: 6px;

  color: #777777;

  font-size: 12px;

  font-weight: 800;
}


/* =====================================================
   五圈一排
===================================================== */

.laps {

  display: grid;

  grid-template-columns:
    repeat(
      5,
      minmax(
        0,
        1fr
      )
    );

  gap: 5px;

  margin-bottom: 10px;
}


/* =====================================================
   單圈
===================================================== */

.lap {

  min-width: 0;

  padding:
    6px
    2px;

  border-radius: 8px;

  background: #f3f3f3;

  text-align: center;
}

.lap-label {

  display: block;

  color: #999999;

  font-size: 8px;

  line-height: 1.2;
}

.lap-value {

  display: block;

  overflow: hidden;

  color: #222222;

  font-size: 12px;

  font-weight: 800;

  line-height: 1.3;

  white-space: nowrap;

  text-overflow: ellipsis;
}


/* =====================================================
   總秒
===================================================== */

.total-box {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  padding:
    10px
    13px;

  border-radius: 12px;

  background: #111111;

  color: #ffffff;
}

.total-label {

  color: #dddddd;

  font-size: 13px;

  font-weight: 700;
}

.total-value {

  font-size: 23px;

  font-weight: 900;
}


/* =====================================================
   查無資料
===================================================== */

.empty {

  padding: 35px 20px;

  border-radius: 18px;

  background: #ffffff;

  color: #888888;

  text-align: center;

  box-shadow:
    0 7px 25px
    rgba(
      0,
      0,
      0,
      0.05
    );
}


/* =====================================================
   Footer
===================================================== */

.footer {

  margin-top: 30px;

  color: #aaaaaa;

  font-size: 12px;

  text-align: center;
}


/* =====================================================
   手機
===================================================== */

@media (
  max-width: 600px
) {

  .page {

    padding:
      18px
      12px
      35px;
  }

  .logo {

    width: 115px;
  }

  .title {

    font-size: 25px;
  }

  .subtitle {

    margin-bottom: 20px;

    font-size: 13px;
  }

  .search-card {

    padding:
      20px
      15px;

    border-radius: 18px;
  }

  .result-card {

    padding: 15px;

    border-radius: 16px;
  }

  .result-item {

    font-size: 18px;
  }

  .result-date {

    font-size: 11px;
  }

  .lap-value {

    font-size: 11px;
  }

  .total-value {

    font-size: 21px;
  }

}


/* =====================================================
   超小螢幕
===================================================== */

@media (
  max-width: 360px
) {

  .page {

    padding-left: 9px;

    padding-right: 9px;
  }

  .search-card {

    padding:
      17px
      12px;
  }

  .result-card {

    padding:
      13px;
  }

  .lap-value {

    font-size: 10px;
  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =================================================
       COLOR Logo
  ================================================= -->

  <div class="logo-area">

    <img
      src="logo.png"
      class="logo"
      alt="COLOR Logo"
    >

  </div>


  <h1 class="title">
    COLOR 成績查詢系統
  </h1>


  <div class="subtitle">
    查詢你的測驗成績
  </div>


  <!-- =================================================
       查詢區
  ================================================= -->

  <div class="search-card">


    <!-- 等級 -->

    <div class="field">

      <label for="level">
        等級
      </label>

      <select id="level">

        <option
          value=""
          selected
        >
          請選擇等級
        </option>

      </select>

    </div>


    <!-- 班別 -->

    <div class="field">

      <label for="className">
        班別
      </label>

      <select
        id="className"
        disabled
      >

        <option
          value=""
          selected
        >
          請先選擇等級
        </option>

      </select>

    </div>


    <!-- 姓名 -->

    <div class="field">

      <label for="name">
        姓名
      </label>

      <input
        id="name"
        type="text"
        placeholder="請輸入姓名"
        autocomplete="off"
      >

    </div>


    <!-- 項目 -->

    <div class="field">

      <label for="item">
        項目
      </label>

      <select
        id="item"
        disabled
      >

        <option
          value=""
          selected
        >
          請先選擇班別及輸入姓名
        </option>

      </select>

    </div>


    <button
      id="searchButton"
      class="search-button"
    >
      查詢成績
    </button>

  </div>


  <!-- 狀態 -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- 結果 -->

  <div
    id="resultsArea"
  ></div>


  <div class="footer">
    COLOR 成績查詢系統
  </div>


</div>



<script>


// =====================================================
// ★ Google Apps Script 網址
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";


// =====================================================
// 元件
// =====================================================

const levelSelect =
  document.getElementById(
    "level"
  );

const classSelect =
  document.getElementById(
    "className"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const itemSelect =
  document.getElementById(
    "item"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const status =
  document.getElementById(
    "status"
  );

const resultsArea =
  document.getElementById(
    "resultsArea"
  );


// =====================================================
// 啟動
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadLevels();

  }
);


// =====================================================
// 讀取等級
// =====================================================

async function loadLevels() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=levels",
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "等級讀取失敗"
      );

    }


    const levels =
      await response.json();


    levelSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        請選擇等級
      </option>
      `;


    if (
      !Array.isArray(levels) ||
      levels.length === 0
    ) {

      levelSelect.innerHTML =
        `
        <option
          value=""
          selected
        >
          沒有等級資料
        </option>
        `;

      return;

    }


    levels.forEach(
      function(level) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          level;

        option.textContent =
          level;


        levelSelect.appendChild(
          option
        );

      }
    );


    levelSelect.disabled =
      false;


  }
  catch (error) {

    console.error(
      error
    );


    levelSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        等級載入失敗
      </option>
      `;


    setStatus(
      "無法取得等級資料",
      "error"
    );

  }

}


// =====================================================
// 選擇等級
// =====================================================

levelSelect.addEventListener(
  "change",
  function() {

    resultsArea.innerHTML =
      "";

    setStatus(
      "",
      ""
    );

    resetClass();

    resetItem();


    if (
      levelSelect.value === ""
    ) {

      return;

    }


    loadClasses();

  }
);


// =====================================================
// 班別
// =====================================================

function resetClass() {

  classSelect.disabled =
    true;

  classSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      請先選擇等級
    </option>
    `;

}


async function loadClasses() {

  const level =
    levelSelect.value;


  if (
    !level
  ) {

    return;

  }


  classSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      班別載入中...
    </option>
    `;


  classSelect.disabled =
    true;


  try {

    const url =
      API_URL +
      "?action=classes" +
      "&level=" +
      encodeURIComponent(
        level
      );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "班別讀取失敗"
      );

    }


    const classes =
      await response.json();


    classSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        請選擇班別
      </option>
      `;


    classes.forEach(
      function(className) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          className;

        option.textContent =
          className;


        classSelect.appendChild(
          option
        );

      }
    );


    if (
      classes.length > 0
    ) {

      classSelect.disabled =
        false;

    }


  }
  catch (error) {

    console.error(
      error
    );


    classSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        班別載入失敗
      </option>
      `;

  }

}


// =====================================================
// 選擇班別
// =====================================================

classSelect.addEventListener(
  "change",
  function() {

    resetItem();

    resultsArea.innerHTML =
      "";

    setStatus(
      "",
      ""
    );


    if (
      classSelect.value !== "" &&
      nameInput.value.trim() !== ""
    ) {

      loadItems();

    }

  }
);


// =====================================================
// 姓名輸入
// =====================================================

nameInput.addEventListener(
  "input",
  function() {

    resetItem();

    resultsArea.innerHTML =
      "";

    setStatus(
      "",
      ""
    );


    if (
      levelSelect.value !== "" &&
      classSelect.value !== "" &&
      nameInput.value.trim() !== ""
    ) {

      loadItems();

    }

  }
);


// =====================================================
// 項目
// =====================================================

function resetItem() {

  itemSelect.disabled =
    true;

  itemSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      請先選擇班別及輸入姓名
    </option>
    `;

}


async function loadItems() {

  const level =
    levelSelect.value;

  const name =
    nameInput.value.trim();

  const className =
    classSelect.value;


  if (
    !level ||
    !name ||
    !className
  ) {

    return;

  }


  itemSelect.disabled =
    true;

  itemSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      項目載入中...
    </option>
    `;


  try {

    const url =
      API_URL +
      "?action=items" +
      "&level=" +
      encodeURIComponent(
        level
      ) +
      "&name=" +
      encodeURIComponent(
        name
      ) +
      "&className=" +
      encodeURIComponent(
        className
      );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "項目讀取失敗"
      );

    }


    const items =
      await response.json();


    itemSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        請選擇項目
      </option>
      `;


    if (
      !Array.isArray(items) ||
      items.length === 0
    ) {

      itemSelect.innerHTML =
        `
        <option
          value=""
          selected
        >
          找不到項目
        </option>
        `;

      return;

    }


    items.forEach(
      function(item) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          item;

        option.textContent =
          item;


        itemSelect.appendChild(
          option
        );

      }
    );


    itemSelect.disabled =
      false;


  }
  catch (error) {

    console.error(
      error
    );


    itemSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        項目載入失敗
      </option>
      `;

  }

}


// =====================================================
// 查詢
// =====================================================

searchButton.addEventListener(
  "click",
  searchScores
);


async function searchScores() {

  const level =
    levelSelect.value;

  const className =
    classSelect.value;

  const name =
    nameInput.value.trim();

  const item =
    itemSelect.value;


  if (!level) {

    setStatus(
      "請選擇等級",
      "error"
    );

    return;

  }


  if (!className) {

    setStatus(
      "請選擇班別",
      "error"
    );

    return;

  }


  if (!name) {

    setStatus(
      "請輸入姓名",
      "error"
    );

    return;

  }


  if (!item) {

    setStatus(
      "請選擇項目",
      "error"
    );

    return;

  }


  searchButton.disabled =
    true;

  searchButton.textContent =
    "查詢中...";


  setStatus(
    "正在查詢成績...",
    "loading"
  );


  resultsArea.innerHTML =
    "";


  try {

    const url =
      API_URL +
      "?action=scores" +
      "&level=" +
      encodeURIComponent(
        level
      ) +
      "&name=" +
      encodeURIComponent(
        name
      ) +
      "&className=" +
      encodeURIComponent(
        className
      ) +
      "&item=" +
      encodeURIComponent(
        item
      );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "成績查詢失敗"
      );

    }


    const results =
      await response.json();


    if (
      !Array.isArray(results) ||
      results.length === 0
    ) {

      setStatus(
        "查無成績資料",
        "error"
      );


      resultsArea.innerHTML =
        `
        <div class="empty">
          找不到這位學員的成績
        </div>
        `;


      return;

    }


    // =================================================
    // 日期由近到遠
    // =================================================

    results.sort(
      function(a, b) {

        const dateA =
          parseTestDate(
            a.testDate
          );

        const dateB =
          parseTestDate(
            b.testDate
          );


        if (
          dateA &&
          !dateB
        ) {

          return -1;

        }


        if (
          !dateA &&
          dateB
        ) {

          return 1;

        }


        if (
          !dateA &&
          !dateB
        ) {

          return 0;

        }


        return (
          dateB.getTime() -
          dateA.getTime()
        );

      }
    );


    // =================================================
    // 最佳成績
    //
    // 只看 K 欄總秒
    // =================================================

    const bestIndex =
      findBestIndex(
        results
      );


    renderResults(
      results,
      bestIndex
    );


    setStatus(
      "查詢完成",
      "success"
    );

  }
  catch (error) {

    console.error(
      error
    );


    setStatus(
      "查詢失敗，請稍後再試",
      "error"
    );

  }
  finally {

    searchButton.disabled =
      false;

    searchButton.textContent =
      "查詢成績";

  }

}


// =====================================================
// 最佳成績
//
// 只比較 K 欄總秒
// =====================================================

function findBestIndex(
  results
) {

  let bestIndex =
    -1;

  let bestSeconds =
    Infinity;


  results.forEach(
    function(
      result,
      index
    ) {

      const seconds =
        parseSeconds(
          result.totalSeconds
        );


      if (
        Number.isFinite(
          seconds
        ) &&
        seconds <
        bestSeconds
      ) {

        bestSeconds =
          seconds;

        bestIndex =
          index;

      }

    }
  );


  return bestIndex;

}


// =====================================================
// 顯示結果
// =====================================================

function renderResults(
  results,
  bestIndex
) {

  let html =
    `
    <h2 class="result-title">
      查詢結果
    </h2>
    `;


  results.forEach(
    function(
      result,
      index
    ) {

      const isBest =
        index === bestIndex;


      // =================================================
      // F～J
      // =================================================

      const laps = [

        {
          label: "圈1",
          value: result.lap1
        },

        {
          label: "圈2",
          value: result.lap2
        },

        {
          label: "圈3",
          value: result.lap3
        },

        {
          label: "圈4",
          value: result.lap4
        },

        {
          label: "圈5",
          value: result.lap5
        }

      ];


      // =================================================
      // 只留下有填寫的圈數
      // =================================================

      const enteredLaps =
        laps.filter(
          function(lap) {

            return hasValue(
              lap.value
            );

          }
        );


      let lapsHtml =
        "";


      if (
        enteredLaps.length > 0
      ) {

        lapsHtml =
          `
          <div class="lap-title">
            圈數成績
          </div>

          <div class="laps">

            ${
              enteredLaps
                .map(
                  function(lap) {

                    return `
                      <div class="lap">

                        <span class="lap-label">
                          ${lap.label}
                        </span>

                        <span class="lap-value">
                          ${escapeHtml(
                            lap.value
                          )}
                        </span>

                      </div>
                    `;

                  }
                )
                .join("")
            }

          </div>
          `;

      }


      html +=
        `
        <div
          class="result-card ${
            isBest
            ?
            "best"
            :
            ""
          }"
        >

          ${
            isBest
            ?
            `
            <div class="best-badge">
              🏆 最佳成績
            </div>
            `
            :
            ""
          }


          <div class="result-top">

            <div class="result-item">

              ${escapeHtml(
                result.item
              )}

            </div>

            <div class="result-date">

              ${escapeHtml(
                result.testDate
              )}

            </div>

          </div>


          <div class="coach">

            教練：
            ${escapeHtml(
              result.coach ||
              "—"
            )}

          </div>


          ${lapsHtml}


          <div class="total-box">

            <span class="total-label">
              總秒
            </span>

            <span class="total-value">

              ${formatTotalSeconds(
                result.totalSeconds
              )}

            </span>

          </div>


        </div>
        `;

    }
  );


  resultsArea.innerHTML =
    html;

}


// =====================================================
// 判斷是否有值
// =====================================================

function hasValue(
  value
) {

  return (
    value !== null &&
    value !== undefined &&
    String(
      value
    ).trim() !== ""
  );

}


// =====================================================
// 秒數解析
//
// 支援：
// 35.52
// 95
// 1:35.52
// =====================================================

function parseSeconds(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return NaN;

  }


  if (
    typeof value === "number"
  ) {

    return value;

  }


  const text =
    String(
      value
    ).trim();


  if (
    text.includes(":")
  ) {

    const parts =
      text.split(":");


    if (
      parts.length === 2
    ) {

      const minutes =
        parseFloat(
          parts[0]
        );

      const seconds =
        parseFloat(
          parts[1]
        );


      if (
        Number.isFinite(
          minutes
        ) &&
        Number.isFinite(
          seconds
        )
      ) {

        return (
          minutes * 60 +
          seconds
        );

      }

    }

  }


  const number =
    parseFloat(
      text
    );


  return Number.isFinite(
    number
  )
  ?
  number
  :
  NaN;

}


// =====================================================
// 顯示總秒
//
// K 欄有什麼就顯示什麼
// =====================================================

function formatTotalSeconds(
  value
) {

  if (
    value === null ||
    value === undefined ||
    String(
      value
    ).trim() === ""
  ) {

    return "—";

  }


  const seconds =
    parseSeconds(
      value
    );


  if (
    !Number.isFinite(
      seconds
    )
  ) {

    return escapeHtml(
      value
    );

  }


  return seconds.toFixed(
    2
  );

}


// =====================================================
// 日期解析
// =====================================================

function parseTestDate(
  value
) {

  if (
    !value
  ) {

    return null;

  }


  const text =
    String(
      value
    ).trim();


  const match =
    text.match(
      /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
    );


  if (!match) {

    return null;

  }


  const date =
    new Date(
      Number(
        match[1]
      ),
      Number(
        match[2]
      ) - 1,
      Number(
        match[3]
      )
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  return date;

}


// =====================================================
// HTML 安全處理
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
    ?
    ""
    :
    value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// =====================================================
// 狀態
// =====================================================

function setStatus(
  message,
  type
) {

  status.textContent =
    message;

  status.className =
    "status " +
    (
      type ||
      ""
    );

}
