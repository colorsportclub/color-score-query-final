<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>COLOR 成績查詢系統</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f5f6f8 0%,
      #ffffff 100%
    );

  color: #222;

}


.page {

  width: 100%;

  max-width: 760px;

  margin: auto;

  padding:
    30px
    20px
    50px;

}


/* =====================================================
   COLOR Logo
===================================================== */

.logo-area {

  text-align: center;

  margin-bottom: 8px;

}


.logo {

  width: 150px;

  max-width: 45vw;

  height: auto;

  display: block;

  margin: auto;

}


/* =====================================================
   標題
===================================================== */

.title {

  text-align: center;

  font-size: 32px;

  font-weight: 900;

  margin:
    8px
    0
    0;

}


.subtitle {

  text-align: center;

  color: #888;

  font-size: 15px;

  margin:
    8px
    0
    28px;

}


/* =====================================================
   查詢卡片
===================================================== */

.search-card {

  background: #fff;

  padding: 28px;

  border-radius: 22px;

  box-shadow:
    0 10px 35px
    rgba(
      0,
      0,
      0,
      0.08
    );

}


.field {

  margin-bottom: 20px;

}


label {

  display: block;

  font-size: 16px;

  font-weight: 700;

  margin-bottom: 8px;

}


input,
select {

  width: 100%;

  height: 52px;

  border:
    1px solid
    #d8dce2;

  border-radius: 13px;

  padding:
    0
    16px;

  background: #fff;

  font-size: 16px;

  outline: none;

}


input:focus,
select:focus {

  border-color: #111;

  box-shadow:
    0 0 0 3px
    rgba(
      0,
      0,
      0,
      0.06
    );

}


select:disabled {

  background: #f1f2f4;

  color: #999;

}


/* =====================================================
   查詢按鈕
===================================================== */

.search-button {

  width: 100%;

  height: 54px;

  border: 0;

  border-radius: 14px;

  background: #111;

  color: #fff;

  font-size: 17px;

  font-weight: 800;

  cursor: pointer;

}


.search-button:disabled {

  background: #999;

}


/* =====================================================
   狀態
===================================================== */

.status {

  min-height: 24px;

  text-align: center;

  margin:
    14px
    0;

  font-size: 15px;

  font-weight: 600;

}


.status.success {

  color: #149447;

}


.status.error {

  color: #d93025;

}


.status.loading {

  color: #777;

}


/* =====================================================
   結果
===================================================== */

.result-title {

  font-size: 21px;

  font-weight: 900;

  margin:
    20px
    0
    15px;

}


.result-card {

  background: #fff;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 16px;

  border:
    1px solid
    #eeeeee;

  box-shadow:
    0 8px 25px
    rgba(
      0,
      0,
      0,
      0.07
    );

}


.result-card.best {

  border:
    2px solid
    #111;

}


.best-badge {

  display: inline-block;

  background: #111;

  color: #fff;

  border-radius: 999px;

  padding:
    5px
    10px;

  font-size: 12px;

  font-weight: 800;

  margin-bottom: 12px;

}


.result-top {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 12px;

}


.result-item {

  font-size: 21px;

  font-weight: 900;

}


.result-date {

  color: #888;

  font-size: 13px;

  white-space: nowrap;

}


.coach {

  color: #666;

  font-size: 14px;

  margin:
    8px
    0
    15px;

}


/* =====================================================
   五圈一排
===================================================== */

.lap-title {

  color: #777;

  font-size: 13px;

  font-weight: 700;

  margin-bottom: 7px;

}


.laps {

  display: grid;

  grid-template-columns:
    repeat(
      5,
      minmax(
        0,
        1fr
      )
    );

  gap: 5px;

  margin-bottom: 10px;

}


.lap {

  min-width: 0;

  background: #f4f5f7;

  border-radius: 9px;

  padding:
    6px
    3px;

  text-align: center;

}


.lap-label {

  display: block;

  font-size: 9px;

  color: #999;

}


.lap-value {

  display: block;

  font-size: 13px;

  font-weight: 800;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.dash {

  color: #aaa;

}


/* =====================================================
   總秒
===================================================== */

.total-box {

  background: #111;

  color: #fff;

  border-radius: 13px;

  padding:
    11px
    14px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

}


.total-label {

  color: #ddd;

  font-size: 13px;

  font-weight: 700;

}


.total-value {

  font-size: 24px;

  font-weight: 900;

}


.best .total-value {

  font-size: 26px;

}


/* =====================================================
   無資料
===================================================== */

.empty {

  text-align: center;

  background: #fff;

  border-radius: 18px;

  padding:
    35px
    20px;

  color: #888;

}


/* =====================================================
   Footer
===================================================== */

.footer {

  text-align: center;

  color: #aaa;

  font-size: 13px;

  margin-top: 35px;

}


/* =====================================================
   手機版
===================================================== */

@media (
  max-width: 600px
) {

  .page {

    padding:
      20px
      14px
      35px;

  }


  .logo {

    width: 115px;

  }


  .title {

    font-size: 25px;

  }


  .subtitle {

    font-size: 13px;

    margin-bottom: 20px;

  }


  .search-card {

    padding:
      20px
      16px;

    border-radius: 18px;

  }


  .result-card {

    padding: 16px;

    border-radius: 17px;

  }


  .result-item {

    font-size: 19px;

  }


  .result-date {

    font-size: 11px;

  }


  .lap-label {

    font-size: 8px;

  }


  .lap-value {

    font-size: 12px;

  }


  .total-value {

    font-size: 22px;

  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =================================================
       COLOR Logo
  ================================================= -->

  <div class="logo-area">

    <img
      src="logo.png"
      class="logo"
      alt="COLOR Logo"
    >

  </div>



  <h1 class="title">
    COLOR 成績查詢系統
  </h1>


  <div class="subtitle">
    查詢你的測驗成績
  </div>



  <!-- =================================================
       查詢區
  ================================================= -->

  <div class="search-card">


    <!-- =================================================
         等級
    ================================================= -->

    <div class="field">

      <label for="level">
        等級
      </label>


      <select id="level">

        <!-- ★ 不自動選擇 -->

        <option
          value=""
          selected
        >
          請選擇等級
        </option>

      </select>

    </div>



    <!-- =================================================
         班別
    ================================================= -->

    <div class="field">

      <label for="className">
        班別
      </label>


      <select
        id="className"
        disabled
      >

        <!-- ★ 不自動選擇 -->

        <option
          value=""
          selected
        >
          請先選擇等級
        </option>

      </select>

    </div>



    <!-- =================================================
         姓名
    ================================================= -->

    <div class="field">

      <label for="name">
        姓名
      </label>


      <input
        id="name"
        type="text"
        placeholder="請輸入姓名"
        autocomplete="off"
      >

    </div>



    <!-- =================================================
         項目
    ================================================= -->

    <div class="field">

      <label for="item">
        項目
      </label>


      <select
        id="item"
        disabled
      >

        <!-- ★ 不自動選擇 -->

        <option
          value=""
          selected
        >
          請先選擇班別及輸入姓名
        </option>

      </select>

    </div>



    <!-- =================================================
         查詢
    ================================================= -->

    <button
      id="searchButton"
      class="search-button"
    >
      查詢成績
    </button>


  </div>



  <div
    id="status"
    class="status"
  ></div>


  <div
    id="resultsArea"
  ></div>


  <div class="footer">
    COLOR 成績查詢系統
  </div>


</div>



<script>


// =====================================================
// Google Apps Script API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";



// =====================================================
// 取得網頁元件
// =====================================================

const levelSelect =
  document.getElementById(
    "level"
  );


const classSelect =
  document.getElementById(
    "className"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const itemSelect =
  document.getElementById(
    "item"
  );


const searchButton =
  document.getElementById(
    "searchButton"
  );


const status =
  document.getElementById(
    "status"
  );


const resultsArea =
  document.getElementById(
    "resultsArea"
  );



// =====================================================
// 網站啟動
//
// ★ 只載入等級
// ★ 不會自動選第一個等級
// ★ 不會自動載入班別
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadLevels();

  }
);



// =====================================================
// 讀取所有等級
// =====================================================

async function loadLevels() {

  levelSelect.disabled =
    true;


  levelSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      等級載入中...
    </option>
    `;


  try {

    const url =
      API_URL +
      "?action=levels";


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "等級讀取失敗"
      );

    }


    const levels =
      await response.json();


    // ---------------------------------------------------
    // ★ 重新建立選單
    // ---------------------------------------------------

    levelSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        請選擇等級
      </option>
      `;


    if (
      !Array.isArray(levels) ||
      levels.length === 0
    ) {

      levelSelect.innerHTML =
        `
        <option
          value=""
          selected
        >
          沒有等級資料
        </option>
        `;

      return;

    }


    levels.forEach(
      function(level) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          level;


        option.textContent =
          level;


        levelSelect.appendChild(
          option
        );

      }
    );


    // ---------------------------------------------------
    // ★ 只解除鎖定
    // ★ 絕對不呼叫 loadClasses()
    // ---------------------------------------------------

    levelSelect.disabled =
      false;


    resetClassSelect();

    resetItemSelect();

  }
  catch (error) {

    console.error(error);


    levelSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        等級載入失敗
      </option>
      `;


    setStatus(
      "無法取得等級資料",
      "error"
    );

  }

}



// =====================================================
// 等級改變
//
// ★ 只有使用者自己選擇等級
// ★ 才會載入班別
// =====================================================

levelSelect.addEventListener(
  "change",
  function() {

    resultsArea.innerHTML =
      "";


    setStatus(
      "",
      ""
    );


    resetItemSelect();


    // -----------------------------------------------
    // 沒選等級
    // -----------------------------------------------

    if (
      levelSelect.value === ""
    ) {

      resetClassSelect();

      return;

    }


    // -----------------------------------------------
    // 有選等級
    // -----------------------------------------------

    loadClasses();

  }
);



// =====================================================
// 重設班別
// =====================================================

function resetClassSelect() {

  classSelect.disabled =
    true;


  classSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      請先選擇等級
    </option>
    `;

}



// =====================================================
// 重設項目
// =====================================================

function resetItemSelect() {

  itemSelect.disabled =
    true;


  itemSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      請先選擇班別及輸入姓名
    </option>
    `;

}



// =====================================================
// 讀取班別
// =====================================================

async function loadClasses() {

  const level =
    levelSelect.value;


  if (
    !level
  ) {

    resetClassSelect();

    return;

  }


  classSelect.disabled =
    true;


  classSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      班別載入中...
    </option>
    `;


  try {

    const url =
      API_URL +
      "?action=classes" +
      "&level=" +
      encodeURIComponent(
        level
      );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "班別讀取失敗"
      );

    }


    const classes =
      await response.json();


    // ---------------------------------------------------
    // ★ 永遠先放「請選擇班別」
    // ---------------------------------------------------

    classSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        請選擇班別
      </option>
      `;


    if (
      !Array.isArray(classes) ||
      classes.length === 0
    ) {

      classSelect.innerHTML =
        `
        <option
          value=""
          selected
        >
          沒有班別資料
        </option>
        `;

      return;

    }


    classes.forEach(
      function(className) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          className;


        option.textContent =
          className;


        classSelect.appendChild(
          option
        );

      }
    );


    classSelect.disabled =
      false;


    // ★ 不自動選班別

    resetItemSelect();

  }
  catch (error) {

    console.error(error);


    classSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        班別載入失敗
      </option>
      `;


    setStatus(
      "班別載入失敗",
      "error"
    );

  }

}



// =====================================================
// 班別改變
// =====================================================

classSelect.addEventListener(
  "change",
  function() {

    resultsArea.innerHTML =
      "";


    setStatus(
      "",
      ""
    );


    resetItemSelect();


    if (
      classSelect.value === ""
    ) {

      return;

    }


    loadItems();

  }
);



// =====================================================
// 姓名輸入
// =====================================================

nameInput.addEventListener(
  "input",
  function() {

    resetItemSelect();


    resultsArea.innerHTML =
      "";


    setStatus(
      "",
      ""
    );


    // ---------------------------------------------------
    // 只有已選班別 + 有姓名才查詢項目
    // ---------------------------------------------------

    if (
      classSelect.value !== "" &&
      nameInput.value.trim() !== ""
    ) {

      loadItems();

    }

  }
);



// =====================================================
// 讀取項目
// =====================================================

async function loadItems() {

  const level =
    levelSelect.value;


  const name =
    nameInput.value.trim();


  const className =
    classSelect.value;


  if (
    !level ||
    !name ||
    !className
  ) {

    resetItemSelect();

    return;

  }


  itemSelect.disabled =
    true;


  itemSelect.innerHTML =
    `
    <option
      value=""
      selected
    >
      項目載入中...
    </option>
    `;


  try {

    const url =
      API_URL +
      "?action=items" +
      "&level=" +
      encodeURIComponent(
        level
      ) +
      "&name=" +
      encodeURIComponent(
        name
      ) +
      "&className=" +
      encodeURIComponent(
        className
      );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "項目讀取失敗"
      );

    }


    const items =
      await response.json();


    // ---------------------------------------------------
    // ★ 永遠先放提示
    // ---------------------------------------------------

    itemSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        請選擇項目
      </option>
      `;


    if (
      !Array.isArray(items) ||
      items.length === 0
    ) {

      itemSelect.innerHTML =
        `
        <option
          value=""
          selected
        >
          找不到項目
        </option>
        `;

      return;

    }


    items.forEach(
      function(item) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          item;


        option.textContent =
          item;


        itemSelect.appendChild(
          option
        );

      }
    );


    itemSelect.disabled =
      false;


    // ★ 不自動選項目

  }
  catch (error) {

    console.error(error);


    itemSelect.innerHTML =
      `
      <option
        value=""
        selected
      >
        項目載入失敗
      </option>
      `;

  }

}



// =====================================================
// 查詢按鈕
// =====================================================

searchButton.addEventListener(
  "click",
  searchScores
);



// =====================================================
// 查詢成績
// =====================================================

async function searchScores() {

  const level =
    levelSelect.value;


  const className =
    classSelect.value;


  const name =
    nameInput.value.trim();


  const item =
    itemSelect.value;



  // ---------------------------------------------------
  // 驗證
  // ---------------------------------------------------

  if (
    !level
  ) {

    setStatus(
      "請選擇等級",
      "error"
    );

    return;

  }


  if (
    !className
  ) {

    setStatus(
      "請選擇班別",
      "error"
    );

    return;

  }


  if (
    !name
  ) {

    setStatus(
      "請輸入姓名",
      "error"
    );

    return;

  }


  if (
    !item
  ) {

    setStatus(
      "請選擇項目",
      "error"
    );

    return;

  }



  searchButton.disabled =
    true;


  searchButton.textContent =
    "查詢中...";


  setStatus(
    "正在查詢成績...",
    "loading"
  );


  resultsArea.innerHTML =
    "";



  try {

    const url =
      API_URL +
      "?level=" +
      encodeURIComponent(
        level
      ) +
      "&name=" +
      encodeURIComponent(
        name
      ) +
      "&className=" +
      encodeURIComponent(
        className
      ) +
      "&item=" +
      encodeURIComponent(
        item
      );


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "查詢失敗"
      );

    }


    const results =
      await response.json();



    if (
      !Array.isArray(results) ||
      results.length === 0
    ) {

      setStatus(
        "查無成績資料",
        "error"
      );


      resultsArea.innerHTML =
        `
        <div class="empty">
          找不到這位學員的成績
        </div>
        `;

      return;

    }



    // =================================================
    // 最佳成績
    //
    // ★ 只看 K 欄總秒
    // ★ 至少兩筆資料才標示最佳
    // =================================================

    const validScores =
      results
        .map(
          function(
            result,
            index
          ) {

            return {

              index:
                index,

              seconds:
                parseSeconds(
                  result.totalSeconds
                )

            };

          }
        )
        .filter(
          function(data) {

            return Number.isFinite(
              data.seconds
            );

          }
        );


    let bestIndex =
      -1;


    if (
      validScores.length >= 2
    ) {

      let best =
        validScores[0];


      validScores.forEach(
        function(current) {

          if (
            current.seconds <
            best.seconds
          ) {

            best =
              current;

          }

        }
      );


      bestIndex =
        best.index;

    }



    renderResults(
      results,
      bestIndex
    );


    setStatus(
      "查詢完成",
      "success"
    );

  }
  catch (error) {

    console.error(error);


    setStatus(
      "查詢失敗，請稍後再試",
      "error"
    );

  }
  finally {

    searchButton.disabled =
      false;


    searchButton.textContent =
      "查詢成績";

  }

}



// =====================================================
// 顯示結果
// =====================================================

function renderResults(
  results,
  bestIndex
) {

  let html =
    `
    <h2 class="result-title">
      查詢結果
    </h2>
    `;


  results.forEach(
    function(
      result,
      index
    ) {

      const isBest =
        index === bestIndex;


      html +=
        `

        <div
          class="result-card ${
            isBest
            ?
            "best"
            :
            ""
          }"
        >

          ${
            isBest
            ?
            `
            <div class="best-badge">
              🏆 最佳成績
            </div>
            `
            :
            ""
          }


          <div class="result-top">

            <div class="result-item">

              ${
                escapeHtml(
                  result.item || ""
                )
              }

            </div>


            <div class="result-date">

              ${
                escapeHtml(
                  result.testDate || ""
                )
              }

            </div>

          </div>


          <div class="coach">

            教練：
            ${
              escapeHtml(
                result.coach || "—"
              )
            }

          </div>


          <div class="lap-title">
            圈數成績
          </div>


          <div class="laps">

            ${
              lapHtml(
                "圈1",
                result.lap1
              )
            }

            ${
              lapHtml(
                "圈2",
                result.lap2
              )
            }

            ${
              lapHtml(
                "圈3",
                result.lap3
              )
            }

            ${
              lapHtml(
                "圈4",
                result.lap4
              )
            }

            ${
              lapHtml(
                "圈5",
                result.lap5
              )
            }

          </div>


          <div class="total-box">

            <span class="total-label">
              總秒
            </span>


            <span class="total-value">

              ${
                formatTotalSeconds(
                  result.totalSeconds
                )
              }

            </span>

          </div>


        </div>

        `;

    }
  );


  resultsArea.innerHTML =
    html;

}



// =====================================================
// 圈數 HTML
// =====================================================

function lapHtml(
  label,
  value
) {

  const empty =
    value === "" ||
    value === null ||
    value === undefined;


  return `

    <div class="lap">

      <span class="lap-label">
        ${label}
      </span>

      <span class="lap-value">

        ${
          empty
          ?
          '<span class="dash">—</span>'
          :
          escapeHtml(value)
        }

      </span>

    </div>

  `;

}



// =====================================================
// 秒數解析
// =====================================================

function parseSeconds(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return NaN;

  }


  if (
    typeof value === "number"
  ) {

    return value;

  }


  const text =
    String(value)
      .trim();


  if (
    text.includes(":")
  ) {

    const parts =
      text.split(":");


    if (
      parts.length === 2
    ) {

      const minutes =
        parseFloat(
          parts[0]
        );


      const seconds =
        parseFloat(
          parts[1]
        );


      if (
        Number.isFinite(
          minutes
        ) &&
        Number.isFinite(
          seconds
        )
      ) {

        return (
          minutes * 60 +
          seconds
        );

      }

    }

  }


  const number =
    parseFloat(
      text
    );


  return Number.isFinite(
    number
  )
  ?
  number
  :
  NaN;

}



// =====================================================
// 顯示總秒
//
// ★ 完全使用 K 欄資料
// =====================================================

function formatTotalSeconds(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "—";

  }


  const seconds =
    parseSeconds(
      value
    );


  if (
    !Number.isFinite(
      seconds
    )
  ) {

    return escapeHtml(
      value
    );

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remain =
    seconds -
    minutes * 60;


  if (
    minutes > 0
  ) {

    return (
      minutes +
      ":" +
      remain
        .toFixed(2)
        .padStart(
          5,
          "0"
        )
    );

  }


  return remain.toFixed(2);

}



// =====================================================
// HTML 安全處理
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
    ?
    ""
    :
    value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



// =====================================================
// 狀態文字
// =====================================================

function setStatus(
  message,
  type
) {

  status.textContent =
    message;


  status.className =
    "status " +
    (
      type || ""
    );

}
