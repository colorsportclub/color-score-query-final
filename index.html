<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COLOR 成績查詢系統</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f5f7fb 0%,
          #ffffff 100%
        );

      color: #222;

      min-height: 100vh;

    }


    .container {

      width: 100%;

      max-width: 560px;

      margin:
        0 auto;

      padding:
        24px 16px 40px;

    }


    /* ========================================================
       Logo
       ======================================================== */

    .logo-box {

      text-align: center;

      margin-bottom: 12px;

    }


    .logo {

      max-width: 180px;

      max-height: 90px;

      object-fit: contain;

    }


    /* ========================================================
       標題
       ======================================================== */

    h1 {

      text-align: center;

      margin:
        8px 0 6px;

      font-size: 27px;

      font-weight: 800;

      letter-spacing: 1px;

    }


    .subtitle {

      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 24px;

    }


    /* ========================================================
       查詢卡片
       ======================================================== */

    .search-card {

      background: #ffffff;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);

      margin-bottom: 20px;

    }


    .field {

      margin-bottom: 16px;

    }


    .field:last-child {

      margin-bottom: 0;

    }


    label {

      display: block;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 7px;

      color: #444;

    }


    select,
    input {

      width: 100%;

      height: 48px;

      border:
        1px solid #d9dce3;

      border-radius: 12px;

      padding:
        0 14px;

      font-size: 16px;

      background: #fff;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;

    }


    select:focus,
    input:focus {

      border-color: #222;

      box-shadow:
        0 0 0 3px
        rgba(0, 0, 0, 0.06);

    }


    select:disabled,
    input:disabled {

      background: #f2f3f5;

      color: #999;

    }


    /* ========================================================
       查詢按鈕
       ======================================================== */

    .search-button {

      width: 100%;

      height: 50px;

      border: none;

      border-radius: 13px;

      margin-top: 6px;

      background: #111;

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;

    }


    .search-button:active {

      transform: scale(0.98);

    }


    .search-button:disabled {

      opacity: 0.45;

      cursor: not-allowed;

    }


    /* ========================================================
       狀態文字
       ======================================================== */

    .status {

      text-align: center;

      color: #777;

      font-size: 14px;

      margin:
        14px 0;

      min-height: 20px;

    }


    /* ========================================================
       結果
       ======================================================== */

    .results {

      display: flex;

      flex-direction: column;

      gap: 14px;

    }


    .result-card {

      background: #fff;

      border-radius: 18px;

      padding: 17px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.07);

    }


    .result-top {

      display: flex;

      justify-content:
        space-between;

      align-items: flex-start;

      gap: 10px;

      margin-bottom: 12px;

    }


    .result-item {

      font-size: 18px;

      font-weight: 800;

    }


    .best {

      display: inline-block;

      margin-top: 5px;

      padding:
        4px 9px;

      border-radius: 20px;

      background: #fff1a8;

      color: #765b00;

      font-size: 12px;

      font-weight: 800;

    }


    .date {

      color: #777;

      font-size: 13px;

      white-space: nowrap;

    }


    .coach {

      font-size: 14px;

      color: #555;

      margin-bottom: 14px;

    }


    /* ========================================================
       圈數
       ======================================================== */

    .laps {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;

      margin-bottom: 12px;

    }


    .lap {

      background: #f5f6f8;

      border-radius: 10px;

      padding: 10px;

      text-align: center;

    }


    .lap-label {

      display: block;

      font-size: 12px;

      color: #777;

      margin-bottom: 3px;

    }


    .lap-value {

      font-size: 17px;

      font-weight: 700;

    }


    /* ========================================================
       總秒
       ======================================================== */

    .total {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      background: #111;

      color: white;

      border-radius: 12px;

      padding:
        12px 14px;

    }


    .total-label {

      font-size: 14px;

      opacity: 0.8;

    }


    .total-value {

      font-size: 22px;

      font-weight: 800;

    }


    /* ========================================================
       沒有資料
       ======================================================== */

    .empty {

      text-align: center;

      background: white;

      border-radius: 18px;

      padding: 28px 20px;

      color: #777;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.06);

    }


    /* ========================================================
       手機
       ======================================================== */

    @media (
      max-width: 480px
    ) {

      .container {

        padding:
          18px 12px 30px;

      }


      h1 {

        font-size: 24px;

      }


      .search-card {

        padding: 16px;

        border-radius: 17px;

      }


      .result-card {

        padding: 14px;

      }


      .laps {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }

  </style>

</head>



<body>


  <div class="container">


    <!-- ======================================================
         Logo
         ====================================================== -->

    <div class="logo-box">

      <!--
        如果你已經有 COLOR Logo：

        把下面 src 改成你的 Logo 圖片網址。

        例如：

        src="images/color-logo.png"
      -->

      <img
        class="logo"
        src="images/color-logo.png"
        alt="COLOR Logo"
        onerror="this.style.display='none'"
      >

    </div>



    <!-- ======================================================
         標題
         ====================================================== -->

    <h1>
      COLOR 成績查詢系統
    </h1>


    <div class="subtitle">
      查詢你的測驗成績
    </div>



    <!-- ======================================================
         查詢區
         ====================================================== -->

    <div class="search-card">


      <!-- ====================================================
           等級
           ==================================================== -->

      <div class="field">

        <label for="level">
          等級
        </label>

        <select id="level">

          <option value="">
            請選擇等級
          </option>

        </select>

      </div>



      <!-- ====================================================
           班別
           ==================================================== -->

      <div class="field">

        <label for="className">
          班別
        </label>

        <select
          id="className"
          disabled
        >

          <option value="">
            請先選擇等級
          </option>

        </select>

      </div>



      <!-- ====================================================
           姓名
           ==================================================== -->

      <div class="field">

        <label for="name">
          姓名
        </label>

        <input
          id="name"
          type="text"
          placeholder="請輸入姓名"
          autocomplete="off"
        >

      </div>



      <!-- ====================================================
           項目
           ==================================================== -->

      <div class="field">

        <label for="item">
          項目
        </label>

        <select
          id="item"
          disabled
        >

          <option value="">
            請先輸入姓名並選擇班別
          </option>

        </select>

      </div>



      <!-- ====================================================
           查詢按鈕
           ==================================================== -->

      <button
        id="searchButton"
        class="search-button"
      >
        查詢成績
      </button>

    </div>



    <!-- ======================================================
         狀態
         ====================================================== -->

    <div
      id="status"
      class="status"
    ></div>



    <!-- ======================================================
         查詢結果
         ====================================================== -->

    <div
      id="results"
      class="results"
    ></div>


  </div>



  <script>

    // ========================================================
    // Apps Script 網頁應用程式網址
    //
    // ⚠️ 請把這裡換成你的 /exec 網址
    // ========================================================

    const API_URL =
      "請貼上你的 Apps Script /exec 網址";



    // ========================================================
    // 取得 HTML 元素
    // ========================================================

    const levelSelect =
      document.getElementById(
        "level"
      );


    const classSelect =
      document.getElementById(
        "className"
      );


    const nameInput =
      document.getElementById(
        "name"
      );


    const itemSelect =
      document.getElementById(
        "item"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    const resultsBox =
      document.getElementById(
        "results"
      );



    // ========================================================
    // 載入等級
    // ========================================================

    async function loadLevels() {

      try {

        status.textContent =
          "正在載入等級…";


        const response =
          await fetch(
            API_URL +
            "?action=levels"
          );


        if (!response.ok) {

          throw new Error(
            "載入等級失敗"
          );

        }


        const levels =
          await response.json();


        levelSelect.innerHTML =
          '<option value="">請選擇等級</option>';


        levels.forEach(
          function(level) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              level;

            option.textContent =
              level;

            levelSelect.appendChild(
              option
            );

          }
        );


        status.textContent = "";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "等級載入失敗，請稍後再試。";

      }

    }



    // ========================================================
    // 選擇等級
    // ========================================================

    levelSelect.addEventListener(
      "change",
      async function() {

        const level =
          levelSelect.value;


        // 清除班別

        classSelect.innerHTML =
          '<option value="">載入班別中…</option>';


        classSelect.disabled =
          true;


        itemSelect.innerHTML =
          '<option value="">請先選擇班別與姓名</option>';


        itemSelect.disabled =
          true;


        resultsBox.innerHTML =
          "";


        if (!level) {

          classSelect.innerHTML =
            '<option value="">請先選擇等級</option>';

          return;

        }


        try {

          status.textContent =
            "正在載入班別…";


          const response =
            await fetch(
              API_URL +
              "?action=classes" +
              "&level=" +
              encodeURIComponent(level)
            );


          if (!response.ok) {

            throw new Error(
              "班別載入失敗"
            );

          }


          const classes =
            await response.json();


          classSelect.innerHTML =
            '<option value="">請選擇班別</option>';


          classes.forEach(
            function(className) {

              const option =
                document.createElement(
                  "option"
                );

              option.value =
                className;

              option.textContent =
                className;

              classSelect.appendChild(
                option
              );

            }
          );


          classSelect.disabled =
            false;


          status.textContent = "";

        }

        catch (error) {

          console.error(error);

          classSelect.innerHTML =
            '<option value="">班別載入失敗</option>';

          status.textContent =
            "班別載入失敗，請稍後再試。";

        }

      }
    );



    // ========================================================
    // 姓名 / 班別改變
    // ========================================================

    classSelect.addEventListener(
      "change",
      loadItems
    );


    nameInput.addEventListener(
      "input",
      debounce(
        loadItems,
        400
      )
    );



    // ========================================================
    // 載入項目
    // ========================================================

    async function loadItems() {

      const level =
        levelSelect.value;

      const className =
        classSelect.value;

      const name =
        nameInput.value.trim();


      itemSelect.innerHTML =
        '<option value="">請選擇項目</option>';


      itemSelect.disabled =
        true;


      if (
        !level ||
        !className ||
        !name
      ) {

        return;

      }


      try {

        status.textContent =
          "正在載入項目…";


        const url =
          API_URL +
          "?action=items" +
          "&level=" +
          encodeURIComponent(level) +
          "&className=" +
          encodeURIComponent(className) +
          "&name=" +
          encodeURIComponent(name);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "項目載入失敗"
          );

        }


        const items =
          await response.json();


        itemSelect.innerHTML =
          '<option value="">請選擇項目</option>';


        items.forEach(
          function(item) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              item;

            option.textContent =
              item;

            itemSelect.appendChild(
              option
            );

          }
        );


        itemSelect.disabled =
          false;


        status.textContent = "";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "項目載入失敗，請稍後再試。";

      }

    }



    // ========================================================
    // 查詢
    // ========================================================

    searchButton.addEventListener(
      "click",
      searchScores
    );



    async function searchScores() {

      const level =
        levelSelect.value;

      const className =
        classSelect.value;

      const name =
        nameInput.value.trim();

      const item =
        itemSelect.value;


      // ------------------------------------------------------
      // 基本檢查
      // ------------------------------------------------------

      if (!level) {

        status.textContent =
          "請先選擇等級。";

        return;

      }


      if (!className) {

        status.textContent =
          "請先選擇班別。";

        return;

      }


      if (!name) {

        status.textContent =
          "請輸入姓名。";

        return;

      }


      if (!item) {

        status.textContent =
          "請選擇項目。";

        return;

      }


      try {

        searchButton.disabled =
          true;


        status.textContent =
          "查詢中…";


        resultsBox.innerHTML =
          "";


        const url =
          API_URL +
          "?action=search" +
          "&level=" +
          encodeURIComponent(level) +
          "&className=" +
          encodeURIComponent(className) +
          "&name=" +
          encodeURIComponent(name) +
          "&item=" +
          encodeURIComponent(item);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "查詢失敗"
          );

        }


        const data =
          await response.json();


        renderResults(data);


        status.textContent =
          data.length > 0
            ? "查詢完成"
            : "找不到符合的成績。";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "查詢失敗，請稍後再試。";

      }

      finally {

        searchButton.disabled =
          false;

      }

    }



    // ========================================================
    // 顯示結果
    // ========================================================

    function renderResults(
      data
    ) {

      resultsBox.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        resultsBox.innerHTML =
          '<div class="empty">目前沒有找到成績</div>';

        return;

      }



      // ------------------------------------------------------
      // 再次按照日期新 → 舊排序
      // ------------------------------------------------------

      data.sort(
        function(a, b) {

          return (
            parseDate(
              b.testDate
            ) -
            parseDate(
              a.testDate
            )
          );

        }
      );



      // ------------------------------------------------------
      // 找出最佳成績
      //
      // 必須至少 2 筆
      // 總秒最低
      // ------------------------------------------------------

      let bestIndex = -1;


      if (
        data.length >= 2
      ) {

        let bestValue =
          Infinity;


        data.forEach(
          function(row, index) {

            const total =
              Number(
                row.totalSeconds
              );


            if (
              !isNaN(total) &&
              total < bestValue
            ) {

              bestValue =
                total;

              bestIndex =
                index;

            }

          }
        );

      }



      // ------------------------------------------------------
      // 產生卡片
      // ------------------------------------------------------

      data.forEach(
        function(row, index) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "result-card";


          // ==================================================
          // 上方
          // ==================================================

          const top =
            document.createElement(
              "div"
            );


          top.className =
            "result-top";


          const left =
            document.createElement(
              "div"
            );


          const itemTitle =
            document.createElement(
              "div"
            );


          itemTitle.className =
            "result-item";


          itemTitle.textContent =
            row.item || "項目";


          left.appendChild(
            itemTitle
          );


          // --------------------------------------------------
          // 最佳成績
          // --------------------------------------------------

          if (
            index === bestIndex
          ) {

            const best =
              document.createElement(
                "div"
              );


            best.className =
              "best";


            best.textContent =
              "🏆 最佳成績";


            left.appendChild(
              best
            );

          }


          top.appendChild(
            left
          );


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "date";


          date.textContent =
            row.testDate || "";


          top.appendChild(
            date
          );


          card.appendChild(
            top
          );



          // ==================================================
          // 教練
          // ==================================================

          if (
            row.coach
          ) {

            const coach =
              document.createElement(
                "div"
              );


            coach.className =
              "coach";


            coach.textContent =
              "教練：" +
              row.coach;


            card.appendChild(
              coach
            );

          }



          // ==================================================
          // 圈數
          // ==================================================

          if (
            row.laps &&
            row.laps.length > 0
          ) {

            const laps =
              document.createElement(
                "div"
              );


            laps.className =
              "laps";


            row.laps.forEach(
              function(
                lap,
                lapIndex
              ) {

                const lapBox =
                  document.createElement(
                    "div"
                  );


                lapBox.className =
                  "lap";


                const label =
                  document.createElement(
                    "span"
                  );


                label.className =
                  "lap-label";


                label.textContent =
                  "圈 " +
                  (lapIndex + 1);


                const value =
                  document.createElement(
                    "span"
                  );


                value.className =
                  "lap-value";


                value.textContent =
                  formatSeconds(lap) +
                  " 秒";


                lapBox.appendChild(
                  label
                );


                lapBox.appendChild(
                  value
                );


                laps.appendChild(
                  lapBox
                );

              }
            );


            card.appendChild(
              laps
            );

          }



          // ==================================================
          // 總秒
          // ==================================================

          const total =
            document.createElement(
              "div"
            );


          total.className =
            "total";


          const totalLabel =
            document.createElement(
              "span"
            );


          totalLabel.className =
            "total-label";


          totalLabel.textContent =
            "總秒";


          const totalValue =
            document.createElement(
              "span"
            );


          totalValue.className =
            "total-value";


          if (
            row.totalSeconds !== null &&
            row.totalSeconds !== undefined &&
            row.totalSeconds !== ""
          ) {

            totalValue.textContent =
              formatSeconds(
                row.totalSeconds
              ) +
              " 秒";

          }
          else {

            totalValue.textContent =
              "—";

          }


          total.appendChild(
            totalLabel
          );


          total.appendChild(
            totalValue
          );


          card.appendChild(
            total
          );


          resultsBox.appendChild(
            card
          );

        }
      );

    }



    // ========================================================
    // 秒數格式
    // ========================================================

    function formatSeconds(
      value
    ) {

      const number =
        Number(value);


      if (
        isNaN(number)
      ) {

        return String(value);

      }


      return number.toFixed(2);

    }



    // ========================================================
    // 日期
    // ========================================================

    function parseDate(
      text
    ) {

      if (!text) {

        return 0;

      }


      const parts =
        String(text)
          .split("/");


      if (
        parts.length !== 3
      ) {

        return 0;

      }


      return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      ).getTime();

    }



    // ========================================================
    // 防止姓名輸入時一直請求 Apps Script
    // ========================================================

    function debounce(
      func,
      delay
    ) {

      let timer;


      return function() {

        const context =
          this;

        const args =
          arguments;


        clearTimeout(
          timer
        );


        timer =
          setTimeout(
            function() {

              func.apply(
                context,
                args
              );

            },
            delay
          );

      };

    }



    // ========================================================
    // 啟動
    // ========================================================

    loadLevels();

  </script>

</body>

</html>
