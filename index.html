<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COLOR 成績查詢系統</title>


  <style>

    /* =====================================================
       基本設定
    ===================================================== */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f5f6f8 0%,
          #ffffff 100%
        );

      color: #222;

      min-height: 100vh;

    }



    /* =====================================================
       整個網站
    ===================================================== */

    .page {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding: 30px 20px 50px;

    }



    /* =====================================================
       Logo
    ===================================================== */

    .logo-area {

      text-align: center;

      margin-bottom: 8px;

    }


    .logo {

      width: 150px;

      max-width: 45vw;

      height: auto;

      object-fit: contain;

      display: block;

      margin: 0 auto 8px;

    }


    /* 如果 logo.png 尚未放入 GitHub */

    .logo-fallback {

      display: none;

      font-size: 34px;

      font-weight: 900;

      letter-spacing: 2px;

    }



    /* =====================================================
       標題
    ===================================================== */

    .title {

      text-align: center;

      font-size: 32px;

      font-weight: 900;

      margin: 0;

      letter-spacing: 1px;

    }


    .subtitle {

      text-align: center;

      color: #888;

      margin-top: 8px;

      margin-bottom: 28px;

      font-size: 15px;

    }



    /* =====================================================
       查詢卡片
    ===================================================== */

    .search-card {

      background: #ffffff;

      border-radius: 22px;

      padding: 28px;

      box-shadow:
        0 10px 35px rgba(
          0,
          0,
          0,
          0.08
        );

      margin-bottom: 30px;

    }



    /* =====================================================
       表單欄位
    ===================================================== */

    .field {

      margin-bottom: 20px;

    }


    .field:last-child {

      margin-bottom: 0;

    }


    label {

      display: block;

      font-size: 16px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    input,
    select {

      width: 100%;

      height: 52px;

      border: 1px solid #d8dce2;

      border-radius: 13px;

      background: #fff;

      padding: 0 16px;

      font-size: 16px;

      color: #222;

      outline: none;

      transition: 0.2s;

    }


    input:focus,
    select:focus {

      border-color: #111;

      box-shadow:
        0 0 0 3px rgba(
          0,
          0,
          0,
          0.06
        );

    }



    /* =====================================================
       查詢按鈕
    ===================================================== */

    .search-button {

      width: 100%;

      height: 54px;

      border: none;

      border-radius: 14px;

      background: #111;

      color: #fff;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

      margin-top: 4px;

    }


    .search-button:hover {

      background: #2b2b2b;

    }


    .search-button:active {

      transform: scale(0.98);

    }


    .search-button:disabled {

      background: #999;

      cursor: not-allowed;

    }



    /* =====================================================
       狀態訊息
    ===================================================== */

    .status {

      text-align: center;

      min-height: 24px;

      margin: 12px 0 18px;

      font-size: 15px;

      font-weight: 600;

    }


    .status.success {

      color: #149447;

    }


    .status.error {

      color: #d93025;

    }


    .status.loading {

      color: #777;

    }



    /* =====================================================
       查詢結果標題
    ===================================================== */

    .result-title {

      font-size: 21px;

      font-weight: 900;

      margin: 0 0 15px;

    }



    /* =====================================================
       成績卡片
    ===================================================== */

    .result-card {

      background: #fff;

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 16px;

      box-shadow:
        0 8px 25px rgba(
          0,
          0,
          0,
          0.07
        );

      border: 1px solid #eeeeee;

      position: relative;

      overflow: hidden;

    }


    /* 最佳成績左側標記 */

    .result-card.best {

      border: 2px solid #111;

      box-shadow:
        0 10px 30px rgba(
          0,
          0,
          0,
          0.12
        );

    }


    .best-badge {

      display: inline-flex;

      align-items: center;

      gap: 5px;

      background: #111;

      color: #fff;

      border-radius: 999px;

      padding: 5px 10px;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 12px;

    }



    /* =====================================================
       項目 + 日期
    ===================================================== */

    .result-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;

      margin-bottom: 10px;

    }


    .result-item {

      font-size: 21px;

      font-weight: 900;

    }


    .result-date {

      color: #888;

      font-size: 14px;

      white-space: nowrap;

      padding-top: 4px;

    }


    .coach {

      color: #666;

      font-size: 14px;

      margin-bottom: 16px;

    }



    /* =====================================================
       圈數標題
    ===================================================== */

    .lap-title {

      font-size: 13px;

      font-weight: 700;

      color: #777;

      margin-bottom: 7px;

    }



    /* =====================================================
       五圈一排
    ===================================================== */

    .laps {

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 5px;

      width: 100%;

      margin-bottom: 10px;

    }


    .lap {

      min-width: 0;

      background: #f4f5f7;

      border-radius: 9px;

      padding: 6px 3px;

      text-align: center;

    }


    .lap-label {

      display: block;

      font-size: 9px;

      color: #999;

      margin-bottom: 2px;

      white-space: nowrap;

    }


    .lap-value {

      display: block;

      font-size: 13px;

      font-weight: 800;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }



    /* =====================================================
       總秒
    ===================================================== */

    .total-box {

      background: #111;

      color: #fff;

      border-radius: 13px;

      padding: 11px 14px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

    }


    .total-label {

      font-size: 13px;

      font-weight: 700;

      color: #ddd;

    }


    .total-value {

      font-size: 24px;

      font-weight: 900;

      letter-spacing: 0.5px;

      text-align: right;

    }


    .best .total-value {

      font-size: 26px;

    }



    /* =====================================================
       沒有圈數時
    ===================================================== */

    .dash {

      color: #aaa;

    }



    /* =====================================================
       沒有資料
    ===================================================== */

    .empty {

      text-align: center;

      padding: 35px 20px;

      background: #fff;

      border-radius: 18px;

      color: #888;

      box-shadow:
        0 8px 25px rgba(
          0,
          0,
          0,
          0.05
        );

    }



    /* =====================================================
       Footer
    ===================================================== */

    .footer {

      text-align: center;

      color: #aaa;

      font-size: 13px;

      margin-top: 35px;

    }



    /* =====================================================
       Loading
    ===================================================== */

    .loading-dot {

      display: inline-block;

      animation:
        loading 1.2s infinite;

    }


    @keyframes loading {

      0% {
        opacity: 0.25;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.25;
      }

    }



    /* =====================================================
       手機版
    ===================================================== */

    @media (
      max-width: 600px
    ) {

      .page {

        padding:
          20px
          14px
          35px;

      }


      .logo {

        width: 115px;

      }


      .title {

        font-size: 25px;

      }


      .subtitle {

        font-size: 13px;

        margin-bottom: 20px;

      }


      .search-card {

        padding: 20px 16px;

        border-radius: 18px;

      }


      label {

        font-size: 15px;

      }


      input,
      select {

        height: 50px;

        font-size: 16px;

      }


      .search-button {

        height: 52px;

      }


      .result-title {

        font-size: 19px;

      }


      .result-card {

        padding: 16px;

        border-radius: 17px;

      }


      .result-item {

        font-size: 19px;

      }


      .result-date {

        font-size: 12px;

      }


      .coach {

        font-size: 13px;

      }


      /* 五圈依然保持同一排 */

      .laps {

        gap: 4px;

      }


      .lap {

        padding:
          5px
          2px;

        border-radius: 8px;

      }


      .lap-label {

        font-size: 8px;

      }


      .lap-value {

        font-size: 12px;

      }


      .total-box {

        padding:
          10px
          12px;

      }


      .total-value {

        font-size: 22px;

      }


      .best .total-value {

        font-size: 24px;

      }

    }



    /* =====================================================
       超小手機
    ===================================================== */

    @media (
      max-width: 360px
    ) {

      .page {

        padding-left: 10px;

        padding-right: 10px;

      }


      .result-card {

        padding: 13px;

      }


      .lap-label {

        font-size: 7px;

      }


      .lap-value {

        font-size: 11px;

      }


      .total-value {

        font-size: 20px;

      }

    }

  </style>

</head>



<body>


  <div class="page">


    <!-- =================================================
         COLOR Logo
    ================================================= -->

    <div class="logo-area">

      <!--
        請把 COLOR Logo 圖片檔案命名為：

        logo.png

        然後上傳到 GitHub 與 index.html
        同一個資料夾。

        如果你的檔名不同，
        修改下面 src 即可。
      -->

      <img
        src="logo.png"
        class="logo"
        alt="COLOR Logo"
        onerror="
          this.style.display='none';
          document.getElementById('logoFallback').style.display='block';
        "
      >


      <div
        id="logoFallback"
        class="logo-fallback"
      >
        COLOR
      </div>

    </div>



    <!-- =================================================
         標題
    ================================================= -->

    <h1 class="title">
      COLOR 成績查詢系統
    </h1>


    <div class="subtitle">
      查詢你的測驗成績
    </div>



    <!-- =================================================
         查詢區
    ================================================= -->

    <div class="search-card">


      <!-- 等級 -->

      <div class="field">

        <label for="level">
          等級
        </label>

        <select id="level">

          <!--
            如果你的試算表還有其他分頁，
            在這裡增加即可。

            例如：

            <option value="初階">初階</option>
            <option value="進階">進階</option>
          -->

          <option value="養成">
            養成
          </option>

        </select>

      </div>



      <!-- 班別 -->

      <div class="field">

        <label for="className">
          班別
        </label>

        <select
          id="className"
          disabled
        >

          <option>
            班別載入中...
          </option>

        </select>

      </div>



      <!-- 姓名 -->

      <div class="field">

        <label for="name">
          姓名
        </label>

        <input
          id="name"
          type="text"
          placeholder="請輸入姓名"
          autocomplete="off"
        >

      </div>



      <!-- 項目 -->

      <div class="field">

        <label for="item">
          項目
        </label>

        <select
          id="item"
          disabled
        >

          <option>
            請先輸入姓名
          </option>

        </select>

      </div>



      <!-- 查詢按鈕 -->

      <button
        id="searchButton"
        class="search-button"
        type="button"
      >
        查詢成績
      </button>

    </div>



    <!-- =================================================
         狀態
    ================================================= -->

    <div
      id="status"
      class="status"
    ></div>



    <!-- =================================================
         查詢結果
    ================================================= -->

    <div id="resultsArea"></div>



    <!-- =================================================
         Footer
    ================================================= -->

    <div class="footer">
      COLOR 成績查詢系統
    </div>


  </div>



  <script>


    // =====================================================
    // Google Apps Script API
    // =====================================================
    //
    // ★ 這就是你目前的 API
    //
    // 如果未來重新部署 Apps Script，
    // 只需要修改這一行。
    //
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxH5g5d8vlbMjs6XxHK4JN634Kg7LuP7Bnmg-qjRnKKYVNNGDaz1s2a0gJE1RVY3uQ5/exec";



    // =====================================================
    // 取得 HTML 元件
    // =====================================================

    const levelSelect =
      document.getElementById(
        "level"
      );


    const classSelect =
      document.getElementById(
        "className"
      );


    const nameInput =
      document.getElementById(
        "name"
      );


    const itemSelect =
      document.getElementById(
        "item"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    const resultsArea =
      document.getElementById(
        "resultsArea"
      );



    // =====================================================
    // 網頁啟動
    // =====================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadClasses();

      }
    );



    // =====================================================
    // 等級改變
    // =====================================================

    levelSelect.addEventListener(
      "change",
      function() {

        classSelect.innerHTML =
          "<option>班別載入中...</option>";

        classSelect.disabled = true;

        itemSelect.innerHTML =
          "<option>請先輸入姓名</option>";

        itemSelect.disabled = true;

        resultsArea.innerHTML = "";

        loadClasses();

      }
    );



    // =====================================================
    // 姓名輸入
    // =====================================================

    nameInput.addEventListener(
      "input",
      function() {

        itemSelect.innerHTML =
          "<option>請選擇項目</option>";

        itemSelect.disabled = true;

        resultsArea.innerHTML = "";

      }
    );



    // =====================================================
    // 班別改變
    // =====================================================

    classSelect.addEventListener(
      "change",
      function() {

        loadItems();

      }
    );



    // =====================================================
    // 讀取班別
    // =====================================================

    async function loadClasses() {

      const level =
        levelSelect.value;


      classSelect.disabled = true;

      classSelect.innerHTML =
        "<option>班別載入中...</option>";


      try {

        const url =
          API_URL +
          "?action=classes" +
          "&level=" +
          encodeURIComponent(level);


        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "班別讀取失敗"
          );

        }


        const classes =
          await response.json();


        classSelect.innerHTML =
          "";


        if (
          !Array.isArray(classes) ||
          classes.length === 0
        ) {

          classSelect.innerHTML =
            "<option>沒有班別資料</option>";

          return;

        }


        classes.forEach(
          function(className) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              className;

            option.textContent =
              className;

            classSelect.appendChild(
              option
            );

          }
        );


        classSelect.disabled =
          false;


        loadItems();

      }
      catch (error) {

        console.error(error);


        classSelect.innerHTML =
          "<option>班別載入失敗</option>";


        setStatus(
          "班別載入失敗，請重新整理",
          "error"
        );

      }

    }



    // =====================================================
    // 讀取項目
    // =====================================================

    async function loadItems() {

      const name =
        nameInput.value.trim();


      const className =
        classSelect.value;


      if (
        name === "" ||
        className === ""
      ) {

        itemSelect.innerHTML =
          "<option>請先輸入姓名</option>";

        itemSelect.disabled = true;

        return;

      }


      itemSelect.disabled = true;

      itemSelect.innerHTML =
        "<option>項目載入中...</option>";


      try {

        const level =
          levelSelect.value;


        const url =
          API_URL +
          "?action=items" +
          "&level=" +
          encodeURIComponent(level) +
          "&name=" +
          encodeURIComponent(name) +
          "&className=" +
          encodeURIComponent(className);


        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "項目讀取失敗"
          );

        }


        const items =
          await response.json();


        itemSelect.innerHTML =
          "";


        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          itemSelect.innerHTML =
            "<option>找不到項目</option>";

          return;

        }


        items.forEach(
          function(item) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              item;

            option.textContent =
              item;

            itemSelect.appendChild(
              option
            );

          }
        );


        itemSelect.disabled =
          false;

      }
      catch (error) {

        console.error(error);


        itemSelect.innerHTML =
          "<option>項目載入失敗</option>";

      }

    }



    // =====================================================
    // 查詢按鈕
    // =====================================================

    searchButton.addEventListener(
      "click",
      searchScores
    );



    // =====================================================
    // Enter 查詢
    // =====================================================

    nameInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          searchScores();

        }

      }
    );



    // =====================================================
    // 查詢成績
    // =====================================================

    async function searchScores() {

      const level =
        levelSelect.value;


      const className =
        classSelect.value;


      const name =
        nameInput.value.trim();


      const item =
        itemSelect.value;


      if (
        !className
      ) {

        setStatus(
          "請選擇班別",
          "error"
        );

        return;

      }


      if (
        !name
      ) {

        setStatus(
          "請輸入姓名",
          "error"
        );

        nameInput.focus();

        return;

      }


      if (
        !item ||
        item === "找不到項目"
      ) {

        setStatus(
          "請選擇項目",
          "error"
        );

        return;

      }



      // ---------------------------------------------------
      // 查詢中
      // ---------------------------------------------------

      searchButton.disabled =
        true;

      searchButton.textContent =
        "查詢中...";


      setStatus(
        "正在查詢成績...",
        "loading"
      );


      resultsArea.innerHTML =
        "";



      try {

        const url =
          API_URL +
          "?level=" +
          encodeURIComponent(level) +
          "&name=" +
          encodeURIComponent(name) +
          "&className=" +
          encodeURIComponent(className) +
          "&item=" +
          encodeURIComponent(item);


        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "查詢失敗"
          );

        }


        const results =
          await response.json();


        if (
          !Array.isArray(results)
        ) {

          throw new Error(
            "資料格式錯誤"
          );

        }


        if (
          results.length === 0
        ) {

          setStatus(
            "查無成績資料",
            "error"
          );

          resultsArea.innerHTML =
            `
            <div class="empty">
              找不到這位學員的成績
            </div>
            `;

          return;

        }



        // -------------------------------------------------
        // 找最佳成績
        //
        // ★ 只比較 K 欄 totalSeconds
        //
        // ★ 有效的總秒數 >= 2 筆
        // 才顯示最佳成績
        // -------------------------------------------------

        const validScores =
          results
            .map(
              function(result, index) {

                return {
                  result: result,
                  index: index,
                  seconds:
                    parseSeconds(
                      result.totalSeconds
                    )
                };

              }
            )
            .filter(
              function(x) {

                return (
                  Number.isFinite(
                    x.seconds
                  )
                );

              }
            );



        let bestIndex =
          -1;


        // -------------------------------------------------
        // 至少 2 筆有效成績
        // 才標示最佳
        // -------------------------------------------------

        if (
          validScores.length >= 2
        ) {

          let best =
            validScores[0];


          validScores.forEach(
            function(current) {

              if (
                current.seconds <
                best.seconds
              ) {

                best =
                  current;

              }

            }
          );


          bestIndex =
            best.index;

        }



        // -------------------------------------------------
        // 顯示結果
        // -------------------------------------------------

        renderResults(
          results,
          bestIndex
        );


        setStatus(
          "查詢完成",
          "success"
        );


      }
      catch (error) {

        console.error(error);


        setStatus(
          "查詢失敗，請稍後再試",
          "error"
        );


        resultsArea.innerHTML =
          `
          <div class="empty">
            目前無法取得成績資料
          </div>
          `;

      }
      finally {

        searchButton.disabled =
          false;

        searchButton.textContent =
          "查詢成績";

      }

    }



    // =====================================================
    // 顯示查詢結果
    // =====================================================

    function renderResults(
      results,
      bestIndex
    ) {

      let html =
        `
        <h2 class="result-title">
          查詢結果
        </h2>
        `;



      results.forEach(
        function(result, index) {

          const isBest =
            index === bestIndex;


          const lap1 =
            displayLap(
              result.lap1
            );


          const lap2 =
            displayLap(
              result.lap2
            );


          const lap3 =
            displayLap(
              result.lap3
            );


          const lap4 =
            displayLap(
              result.lap4
            );


          const lap5 =
            displayLap(
              result.lap5
            );


          // ------------------------------------------------
          // K 欄總秒
          //
          // 直接顯示試算表 K 欄
          // ------------------------------------------------

          const total =
            formatTotalSeconds(
              result.totalSeconds
            );



          html += `

            <div
              class="result-card ${
                isBest ? "best" : ""
              }"
            >

              ${
                isBest
                ?
                `
                <div class="best-badge">
                  🏆 最佳成績
                </div>
                `
                :
                ""
              }


              <div class="result-top">

                <div class="result-item">
                  ${escapeHtml(
                    result.item || ""
                  )}
                </div>


                <div class="result-date">
                  ${escapeHtml(
                    result.testDate || ""
                  )}
                </div>

              </div>


              <div class="coach">
                教練：
                ${escapeHtml(
                  result.coach || "—"
                )}
              </div>


              <div class="lap-title">
                圈數成績
              </div>


              <div class="laps">

                ${createLapHtml(
                  "圈1",
                  lap1
                )}

                ${createLapHtml(
                  "圈2",
                  lap2
                )}

                ${createLapHtml(
                  "圈3",
                  lap3
                )}

                ${createLapHtml(
                  "圈4",
                  lap4
                )}

                ${createLapHtml(
                  "圈5",
                  lap5
                )}

              </div>


              <div class="total-box">

                <span class="total-label">
                  總秒
                </span>

                <span class="total-value">
                  ${escapeHtml(
                    total
                  )}
                </span>

              </div>

            </div>

          `;

        }
      );


      resultsArea.innerHTML =
        html;

    }



    // =====================================================
    // 建立單圈 HTML
    // =====================================================

    function createLapHtml(
      label,
      value
    ) {

      return `

        <div class="lap">

          <span class="lap-label">
            ${label}
          </span>

          <span class="lap-value">
            ${
              value === "—"
              ?
              `<span class="dash">—</span>`
              :
              escapeHtml(value)
            }
          </span>

        </div>

      `;

    }



    // =====================================================
    // 圈數顯示
    // =====================================================

    function displayLap(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "—";

      }


      return String(value);

    }



    // =====================================================
    // K 欄總秒解析
    // =====================================================
    //
    // 支援：
    //
    // 90.29
    // "90.29"
    // 1:30.29
    //
    // =====================================================

    function parseSeconds(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return NaN;

      }


      // -----------------------------------------------
      // 數字
      // -----------------------------------------------

      if (
        typeof value === "number"
      ) {

        return value;

      }


      const text =
        String(value)
          .trim();


      if (
        text === ""
      ) {

        return NaN;

      }



      // -----------------------------------------------
      // 分:秒
      // -----------------------------------------------

      if (
        text.includes(":")
      ) {

        const parts =
          text.split(":");


        if (
          parts.length === 2
        ) {

          const minutes =
            parseFloat(
              parts[0]
            );


          const seconds =
            parseFloat(
              parts[1]
            );


          if (
            Number.isFinite(
              minutes
            ) &&
            Number.isFinite(
              seconds
            )
          ) {

            return (
              minutes * 60 +
              seconds
            );

          }

        }

      }



      // -----------------------------------------------
      // 一般數字
      // -----------------------------------------------

      const number =
        parseFloat(text);


      if (
        Number.isFinite(number)
      ) {

        return number;

      }


      return NaN;

    }



    // =====================================================
    // 總秒格式化
    // =====================================================
    //
    // 90.29
    // →
    // 1:30.29
    //
    // 45
    // →
    // 45.00
    //
    // =====================================================

    function formatTotalSeconds(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "—";

      }


      const seconds =
        parseSeconds(value);


      if (
        !Number.isFinite(
          seconds
        )
      ) {

        return String(value);

      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      const remain =
        seconds -
        minutes * 60;


      // -------------------------------------------------
      // 有分鐘
      // -------------------------------------------------

      if (
        minutes > 0
      ) {

        return (
          minutes +
          ":" +
          remain
            .toFixed(2)
            .padStart(
              5,
              "0"
            )
        );

      }


      // -------------------------------------------------
      // 沒有分鐘
      // -------------------------------------------------

      return remain.toFixed(2);

    }



    // =====================================================
    // HTML 安全處理
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(
        value === null ||
        value === undefined
        ?
        ""
        :
        value
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }



    // =====================================================
    // 狀態訊息
    // =====================================================

    function setStatus(
      message,
      type
    ) {

      status.textContent =
        message;


      status.className =
        "status " +
        (
          type || ""
        );

    }


  </script>
